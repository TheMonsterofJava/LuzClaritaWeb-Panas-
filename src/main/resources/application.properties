spring.application.name=LuzClaritaWeb

server.port=8081

## Conexión a la BD
spring.datasource.url=jdbc:mysql://localhost/LuzClaritaWeb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=PepaSql

## Configuracion de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

## Otras opciones de SQL
spring.jpa.show-sql=true
##spring.jpa.hibernate.ddl-auto=create-only
##spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=update

## Google OAuth2 Configuration
# Reemplazar con tus credenciales de Google Cloud Console
spring.security.oauth2.client.registration.google.client-id=TU_CLIENT_ID_DE_GOOGLE
spring.security.oauth2.client.registration.google.client-secret=TU_CLIENT_SECRET_DE_GOOGLE
spring.security.oauth2.client.registration.google.scope=profile, email

spring.application.name=LuzClaritaWeb
server.port=8081
spring.thymeleaf.encoding=UTF-8

##Configuraciones de Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true

# Configuración de logging para debug (opcional)
logging.level.org.springframework.web.servlet.mvc.method.annotation=DEBUG

# Logs detallados de Spring Security
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.analistas=TRACE

# Hibernate SQL queries
spring.jpa.properties.hibernate.format_sql=true

## Conexión a la BD
## Configuracion de la base de datos
## Pusimos codificacion UTF-8 para evitar problemas con caracteres especiales
##spring.datasource.url=jdbc:mysql://localhost:3306/LuzClaritaWeb?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true?allowPublicKeyRetrieval=true?useSSL=false
## Con estas configuraciones evitamos necesitar abrir mysql workbench 
spring.datasource.url=jdbc:mysql://localhost:3306/LuzClaritaWeb?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.jpa.properties.hibernate.connection.CharSet=utf8
spring.jpa.properties.hibernate.connection.characterEncoding=utf8
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.datasource.username=TheMonster
spring.datasource.password=P3p4Sql31

## Explicacion de las etiquetas:
##allowPublicKeyRetrieval=true: Permite al driver recuperar la clave pública del servidor (necesario para autenticación).
##useSSL=false: Desactiva SSL (asegúrate de que sea solo en entornos de desarrollo).


## Configuracion de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

## Otras opciones de SQL
spring.jpa.show-sql=true
##spring.jpa.hibernate.ddl-auto=create-only
##spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=update

## Crear sql de la base de datos
##spring.jpa.properties.javax.persistence.schema-generation.scripts.action=create
##spring.jpa.properties.javax.persistence.schema-generation.scripts.create-target=src/main/resources/luzclaritaweb.sql
##spring.jpa.properties.javax.persistence.schema-generation.scripts.create-source=metadata

##Configurar thymeleaft:
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
# Configuración de Thymeleaf

spring.thymeleaf.servlet.content-type=text/html

spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
# Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

# Facebook
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=public_profile,email

# --- Configuracion para la carga de archivos para las fotos---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Mensaje de error para el login
#seguridad.mensaje-error-autenticacion=Credenciales inválidas

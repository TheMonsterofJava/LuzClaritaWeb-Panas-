<!DOCTYPE html>
<html lang="es"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:th="http://thymeleaf.org/"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/layout}">
<head>
    <title th:text="${titulo}">Cursos</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- BS 5.3 CDN CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .curso-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border-radius: 10px;
            overflow: hidden;
            border: none;+
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .curso-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .curso-img-container {
            height: 180px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
        }

        .curso-img {
            object-fit: cover;
            width: 100%;
            height: 100%;
            transition: transform 0.3s ease;
        }

        .curso-card:hover .curso-img {
            transform: scale(1.05);
        }

        .precio-badge {
            background-color: #F8C8DC;
            color: #fff;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div layout:fragment="contenido">
        <div class="container py-4">
            <div class="row g-4" th:if="${cursos != null and !cursos.isEmpty()}">
                <div class="col-12 col-sm-6 col-md-4 col-lg-3" th:each="curso : ${cursos}">
                    <div class="card curso-card h-100">
                        <!-- Imagen del curso con manejo de URL vacía/nula -->
                        <div class="curso-img-container">
                            <img th:src="${curso.imagenUrl != null and !#strings.isEmpty(curso.imagenUrl)} ? 
                                    ${curso.imagenUrl} : '/img/no-image.png'"
                                class="card-img-top curso-img"
                                alt="Imagen del curso"
                                th:attr="alt=${curso.nombreCurso}"
                                onerror="this.src='/img/no-image.png'" />
                        </div>
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title mb-2" th:text="${curso.nombreCurso}">Nombre del Curso</h5>
                            <div class="mb-2">
                                <span class="precio-badge" th:text="${#numbers.formatCurrency(curso.precio)}"></span>
                            </div>
                            <div class="mt-auto">
                                <a th:href="@{/cursos/{id}(id=${curso.id})}" 
                                class="btn btn-sm btn-outline-primary w-100">
                                    Ver detalles
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div th:if="${cursos == null or cursos.isEmpty()}" class="alert alert-info text-center mt-5">
                <i class="fas fa-info-circle me-2"></i> No hay cursos disponibles.
            </div>
        </div>
    </div>

    <!-- BS5 CDN JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Font Awesome (opcional para íconos) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
</body>
</html>

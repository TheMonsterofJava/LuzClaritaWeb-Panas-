<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://thymeleaf.org/"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">

<head>
    <title th:text="${titulo}"></title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Estilos personalizados -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        :root {
            --rosa-pastel: #FFE4E1;
            --rosa-claro: #F8C8DC;
            --rosa-medio: #F4A6C1;
            --texto-oscuro: #5A5A5A;
        }
        
        body {
            background-color: #fafafa;
        }
        
        .container-listado {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 15px;
        }
        
        .titulo-principal {
            color: var(--texto-oscuro);
            font-weight: 600;
            margin-bottom: 1.5rem;
            position: relative;
            padding-bottom: 0.5rem;
        }
        
        .titulo-principal::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 80px;
            height: 4px;
            background-color: var(--rosa-medio);
            border-radius: 2px;
        }
        
        .btn-nuevo {
            background-color: var(--rosa-medio);
            border-color: var(--rosa-medio);
            color: white;
            font-weight: 500;
            margin-bottom: 1.5rem;
            transition: all 0.3s;
        }
        
        .btn-nuevo:hover {
            background-color: #e095b0;
            border-color: #e095b0;
            transform: translateY(-2px);
        }
        
        .table-container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }
        
        .table-custom {
            margin-bottom: 0;
        }
        
        .table-custom thead {
            background-color: var(--rosa-claro);
            color: white;
        }
        
        .table-custom th {
            font-weight: 500;
            padding: 1rem;
            border: none;
        }
        
        .table-custom td {
            padding: 1rem;
            vertical-align: middle;
            border-top: 1px solid #f0f0f0;
            color: var(--texto-oscuro);
        }
        
        .table-custom tbody tr:hover {
            background-color: var(--rosa-pastel);
        }
        
        .btn-action {
            padding: 0.35rem 0.75rem;
            font-size: 0.85rem;
            border-radius: 5px;
            margin-right: 0.5rem;
            transition: all 0.2s;
        }
        
        .btn-edit {
            background-color: #a7c5eb;
            border-color: #a7c5eb;
            color: white;
        }
        
        .btn-edit:hover {
            background-color: #8fb4e5;
            border-color: #8fb4e5;
            color: white;
        }
        
        .btn-delete {
            background-color: #f3a4a4;
            border-color: #f3a4a4;
            color: white;
        }
        
        .btn-delete:hover {
            background-color: #e89090;
            border-color: #e89090;
            color: white;
        }
        
        .alert-empty {
            background-color: var(--rosa-pastel);
            border-color: var(--rosa-claro);
            color: var(--texto-oscuro);
            border-radius: 8px;
        }
        
        .precio-formato {
            font-weight: 500;
            color: #4a8f29;
        }
    </style>
</head>

<body>
    <div layout:fragment="contenido">
        <div class="container-listado">
            <h1 th:text="${titulo}" class="titulo-principal"></h1>

            <!-- Alertas -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="fas fa-check-circle me-2"></i>
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fas fa-exclamation-circle me-2"></i>
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Botón Nuevo Curso -->
            <a th:href="@{/cursos/form}" class="btn btn-nuevo">
                <i class="fas fa-plus-circle me-2"></i>Nuevo Curso
            </a>

            <!-- Tabla de Cursos -->
            <div th:if="${cursos != null and !cursos.isEmpty()}">
                <div class="table-container">
                    <table class="table table-custom">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Descripción</th>
                                <th>Precio</th>
                                <th>Video</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="curso : ${cursos}" th:object="${curso}">
                                <td th:text="*{id}"></td>
                                <td>
                                    <strong th:text="*{nombreCurso} ?: 'Sin nombre'"></strong>
                                </td>
                                <td>
                                    <span th:text="*{descripcion} ?: 'Sin descripción'"></span>
                                </td>
                                <td>
                                    <span class="precio-formato" 
                                        th:text="${#numbers.formatCurrency(curso.precio)}"
                                        th:if="*{precio != null}"></span>
                                    <span th:if="*{precio == null}" class="text-muted">N/A</span>
                                </td>
                                <td class="video-link-cell">
                                    <a th:href="${curso.videoUrl}" th:text="${curso.videoUrl}" target="_blank"
                                    th:if="${curso.videoUrl != null}"></a>
                                    <span th:if="${curso.videoUrl == null}">Sin video</span>
                                </td>
                                <td>
                                    <a th:href="@{/cursos/{id}(id=*{id})}" 
                                    class="btn btn-action btn-info" style="background-color:#a6e3b2; color:#333;">
                                        <i class="fas fa-eye me-1"></i>Ver
                                    </a>
                                    <a th:href="@{/cursos/form/{id}(id=*{id})}" 
                                    class="btn btn-action btn-edit">
                                        <i class="fas fa-edit me-1"></i>Editar
                                    </a>
                                    <a th:href="@{/cursos/delete/{id}(id=*{id})}" 
                                        class="btn btn-action btn-delete"
                                        onclick="return confirm('¿Estás seguro de eliminar este curso?');">
                                    <i class="fas fa-trash-alt me-1"></i>Eliminar
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Mensaje cuando no hay cursos -->
            <div th:if="${cursos == null or cursos.isEmpty()}" 
                 class="alert alert-empty text-center py-4">
                <i class="fas fa-book-open fa-2x mb-3" style="color: var(--rosa-medio);"></i>
                <h5 class="mb-2">No hay cursos registrados</h5>
                <p class="mb-0">Comienza agregando un nuevo curso haciendo clic en el botón superior</p>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Font Awesome JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <!-- Scripts propios de la pagina -->
    <script th:fragment="js"></script>
    <script src="/js/carrito.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/layout}">

<head>
    <title th:text="${titulo}">Listado de Recetas</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- jQuery DEBE ir primero -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- CSRF Tokens -->
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <!-- Luego DataTables -->
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.12.1/css/jquery.dataTables.min.css">
    <script type="text/javascript" src="https://cdn.datatables.net/1.12.1/js/jquery.dataTables.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.12.1/css/jquery.dataTables.min.css">
    <link rel="stylesheet" th:href="@{/css/recetas.css}">
</head>

<body>
    <div layout:fragment="contenido" class="container py-4">
        <div class="container1">
            <h2 class="mb-4" th:text="${titulo}">Listado de Recetas</h2>
            <table id="tabla-recetas" class="table table-striped">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Tiempo</th>
                        <th>Precio</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="r : ${recetas}" th:class="${not r.activo} ? 'tachado' : ''">
                        <td th:text="${r.nombre_receta}">Nombre</td>
                        <td th:text="${r.descripcion}">Descripción</td>
                        <td th:text="${r.tiempo}">Tiempo</td>
                        <td th:text="${r.precio}">Precio</td>
                        <td>
                            <div class="d-flex flex-wrap gap-2">
                                <a th:href="@{/recetas/editar/{id}(id=${r.id})}"
                                    class="btn btn-warning btn-sm">Editar</a>
                                <a th:href="@{/recetas/borrar/{id}(id=${r.id})}" class="btn btn-secondary btn-sm">
                                    <span th:text="${not r.activo} ? 'Habilitar' : 'Deshabilitar'"></span>
                                </a>

                                <!-- BOTÓN NUEVO PARA ELIMINAR -->
                                <a href="#" th:data-url="@{/recetas/eliminar/{id}(id=${r.id})}"
                                    onclick="confirmarEliminacionReceta(event, this)" class="btn btn-danger btn-sm">
                                    Eliminar
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
                <tfoot>
                </tfoot>
            </table>
            <div class="text-end mt-3">
                <a th:href="@{/recetas/form}" class="btn btn-outline-primary">
                    <i class="bi bi-plus-circle"></i> Añadir receta
                </a>
            </div>
        </div>
    </div>

    <!-- Fragmento de JavaScript específico para esta página -->
    <script th:fragment="js">
        // DataTable para las recetas
        $(document).ready(function () {
            $('#tabla-recetas').DataTable({
                "language": {
                    "url": "/js/datatables/i18n/es-ES.json"
                }
            });
        });
    </script>
    <!-- SweetAlert2 JS -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        function confirmarEliminacionReceta(event, element) {
            event.preventDefault();

            const url = element.getAttribute('data-url');
            const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

            Swal.fire({
                title: '¿Estás seguro de eliminar esta receta?',
                text: "¡Esta acción es permanente y no se puede revertir!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Sí, ¡eliminar!',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    let headers = {
                        'Content-Type': 'application/json'
                    };
                    headers[csrfHeader] = csrfToken;

                    fetch(url, {
                        method: 'POST',
                        headers: headers
                    })
                        .then(response => response.json())
                        .then(data => {
                            if (data.success) {
                                Swal.fire(
                                    '¡Eliminada!',
                                    data.message,
                                    'success'
                                ).then(() => {
                                    // Recarga la página para ver la lista actualizada
                                    window.location.reload();
                                });
                            } else {
                                Swal.fire('Error', data.message, 'error');
                            }
                        })
                        .catch(error => {
                            console.error('Error:', error);
                            Swal.fire('Error', 'Ocurrió un error al procesar la solicitud.', 'error');
                        });
                }
            });
        }
        /*]]>*/
    </script>

    <!-- Scripts adicionales -->
    <!--Sweet Alert-->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:src="@{/js/recetas-listado.js}"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="text/javascript" src="https://cdn.datatables.net/1.12.1/js/jquery.dataTables.min.js"></script>
</body>

</html>

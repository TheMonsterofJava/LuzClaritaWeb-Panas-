<!DOCTYPE html>
<html lang="es"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/layout}">
<head>
    <title th:text="${titulo}">Listado de Recetas</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/recetas.css}">

    <!-- datatable -->
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.12.1/css/jquery.dataTables.min.css">
</head>

<body>
<div layout:fragment="contenido" class="container py-4">
    <div class="container1">
        <h2 class="mb-4" th:text="${titulo}">Listado de Recetas</h2>
        <table id="tabla-recetas" class="table table-striped">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Tiempo</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="r : ${recetas}"
                th:class="${not r.activo} ? 'tachado' : ''">
                    <td th:text="${r.nombre_receta}">Nombre</td>
                    <td th:text="${r.descripcion}">Descripción</td>
                    <td th:text="${r.tiempo}">Tiempo</td>
                    <td>
                        <div class="d-flex flex-wrap gap-2">
                            <a th:href="@{/recetas/detalle/{id}(id=${r.id})}" class="btn btn-info btn-sm">Ver detalle</a>
                            <a th:href="@{/recetas/editar/} + ${r.id}" class="btn btn-warning btn-sm">Editar</a>
                            <a th:href="@{/recetas/borrar/} + ${r.id}" class="btn btn-danger btn-sm">
                                <span th:text="${not r.activo} ? 'Habilitar' : 'Deshabilitar'"></span>
                            </a>
                        </div>
                    </td>
                </tr>
            </tbody>
            <tfoot>
            </tfoot>
        </table>
        <div class="text-end mt-3">
            <a th:href="@{/recetas/form}" class="btn btn-outline-primary">
                <i class="bi bi-plus-circle"></i> Añadir receta
            </a>
        </div>
    </div>
</div>

<!-- Fragmento de JavaScript específico para esta página -->
<script th:fragment="js">
    // DataTable para las recetas
    $(document).ready(function() {
        $('#tabla-recetas').DataTable({
            "language": {
                "url": "//cdn.datatables.net/plug-ins/1.12.1/i18n/es-ES.json"
            }
        });
    });
</script>

<!-- Scripts adicionales -->
<script th:src="@{/js/recetas-listado.js}"></script>
<script type="text/javascript" src="https://cdn.datatables.net/1.12.1/js/jquery.dataTables.min.js"></script>

</body>
</html>

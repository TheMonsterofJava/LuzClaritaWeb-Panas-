<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Listado de Recetas</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
          crossorigin="anonymous">
    
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" 
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS de DataTables -->
    <link rel="stylesheet" 
          href="https://cdn.datatables.net/1.12.1/css/jquery.dataTables.min.css">
    <link rel="stylesheet" th:href="@{/css/recetas.css}">

    <!-- Estilos personalizados -->
    <th:block layout:fragment="styles">
         <style>
            html, body {
                height: 100%;
                margin: 0;
                padding: 0;
            }
            
            .main-content {
                min-height: 100vh;
            }
         </style>
    </th:block>
</head>

<body>
    
    <!-- Contenido principal -->
    <div layout:fragment="content" class="main-content">
        <div class="card card-text">
            <div class="card-header bg-light">
                <h2 class="mb-0" th:text="${titulo}">Listado de Recetas</h2>
            </div>
            
            <div class="card-body">
                <table id="tabla-recetas" class="table table-striped table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Tiempo</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    
                    <tbody>
                        <tr th:each="r : ${recetas}"
                            th:class="${not r.activo} ? 'table-secondary' : ''">
                            <td th:text="${r.nombre_receta}">Nombre</td>
                            <td th:text="${r.descripcion}">Descripción</td>
                            <td th:text="${r.tiempo}">Tiempo</td>
                            <td class="text-end">
                                <div class="btn-group" role="group">
                                    <a th:href="@{/recetas/detalle/{id}(id=${r.id})}" 
                                       class="btn btn-sm btn-outline-info"
                                       title="Ver detalle">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    
                                    <a th:href="@{/recetas/editar/} + ${r.id}" 
                                       class="btn btn-sm btn-outline-warning"
                                       title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    
                                    <a th:href="@{/recetas/borrar/} + ${r.id}" 
                                       class="btn btn-sm btn-outline-danger"
                                       th:classappend="${not r.activo} ? 'btn-outline-success' : 'btn-outline-danger'"
                                       th:title="${not r.activo} ? 'Habilitar' : 'Deshabilitar'">
                                        <i th:class="${not r.activo} ? 'bi bi-check-circle' : 'bi bi-x-circle'"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
                
                <div class="text-end mt-3">
                    <a th:href="@{/recetas/form}" 
                       class="btn btn-primary"
                       title="Añadir nueva receta">
                        <i class="bi bi-plus-lg"></i> Nueva Receta
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Fragmento de JavaScript -->
    <th:block layout:fragment="scripts">
        <!-- jQuery -->
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        
        <!-- JS de DataTables -->
        <script src="https://cdn.datatables.net/1.12.1/js/jquery.dataTables.min.js"></script>
        
        <script>
            $(document).ready(function() {
                $('#tabla-recetas').DataTable({
                    language: {
                        "decimal": ",",
                        "emptyTable": "No hay datos disponibles",
                        "info": "Mostrando _START_ a _END_ de _TOTAL_ registros",
                        "infoEmpty": "Mostrando 0 a 0 de 0 registros",
                        "infoFiltered": "(filtrado de _MAX_ registros totales)",
                        "lengthMenu": "Mostrar _MENU_ registros",
                        "loadingRecords": "Cargando...",
                        "search": "Buscar:",
                        "zeroRecords": "No se encontraron registros coincidentes",
                        "paginate": {
                            "first": "Primero",
                            "last": "Último",
                            "next": "Siguiente",
                            "previous": "Anterior"
                        }
                    },
                    responsive: true,
                    columnDefs: [
                        { orderable: false, targets: -1 } // Deshabilitar ordenación en columna de acciones
                    ]
                });
            });
        </script>
    </th:block>
</body>
</html>

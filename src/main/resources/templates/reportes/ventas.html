<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}"></title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container-fluid px-4">
            <h1 class="mt-4" th:text="${titulo}"></h1>
            <ol class="breadcrumb mb-4">
                <li class="breadcrumb-item"><a th:href="@{/admin/dashboard-1}">Dashboard</a></li>
                <li class="breadcrumb-item active">Reporte de Ventas</li>
            </ol>

            <div class="card mb-4">
                <div class="card-header">
                    <i class="fas fa-table me-1"></i>
                    Listado de Ventas Online
                </div>
                <div class="card-body">
                    <div th:if="${#lists.isEmpty(ventas)}" class="alert alert-info" role="alert">
                        No hay ventas registradas todavía.
                    </div>

                    <table th:if="${not #lists.isEmpty(ventas)}" id="datatablesSimple" class="table table-striped table-bordered">
                        <thead>
                            <tr>
                                <th>Fecha y Hora</th>
                                <th>Descripción del Producto</th>
                                <th>Cantidad</th>
                                <th>Precio Unitario</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="venta : ${ventas}">
                                <td th:text="${#temporals.format(venta.fecha, 'dd-MM-yyyy HH:mm')}"></td>
                                <td th:text="${venta.descripcionProducto}"></td>
                                <td th:text="${venta.cantidad}"></td>
                                <td th:text="${#numbers.formatCurrency(venta.precioUnitario)}"></td>
                                <td th:text="${#numbers.formatCurrency(venta.totalVenta)}"></td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <th colspan="4" style="text-align:right">Total General de Ingresos:</th>
                                <th th:text="${#numbers.formatCurrency(totalGeneral)}"></th>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script th:fragment="js"></script>
</body>
</html>

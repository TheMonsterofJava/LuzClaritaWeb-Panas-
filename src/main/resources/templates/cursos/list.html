<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin}">

<head>
    <title th:text="${titulo}"></title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Panel de administración de cursos">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Font Awesome 6.4 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer">

    <!-- Estilos personalizados -->
    <link rel="stylesheet" th:href="@{/css/cursos.css}">

    <th:block layout:fragment="styles">
        <style>
            body, html {
            height: 100%;
            margin: 0;
        }
        .main-content {
            min-height: 100vh;
            padding: 20px;
        }
        </style>
    </th:block>
</head>

<body>
    <!-- Contenido principal -->
    <main layout:fragment="content" class="main-content">
        <div class="container-listado">
            <header class="page-header mb-4">
                <h1 th:text="${titulo}" class="titulo-principal"></h1>
            </header>

            <!-- Alertas -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="fas fa-check-circle me-2"></i>
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fas fa-exclamation-circle me-2"></i>
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
            </div>

            <!-- Controles superiores -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="search-box">
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" placeholder="Buscar cursos..." aria-label="Buscar">
                        <button class="btn btn-outline-primary" type="submit">
                            <i class="fas fa-search"></i>
                        </button>
                    </form>
                </div>
                <a th:href="@{/cursos/form}" class="btn btn-primary">
                    <i class="fas fa-plus-circle me-2"></i>Nuevo Curso
                </a>
            </div>

            <!-- Tabla de Cursos -->
            <div th:if="${cursos != null and !cursos.isEmpty()}">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Nombre</th>
                                <th scope="col">Descripción</th>
                                <th scope="col" class="text-end">Precio</th>
                                <th scope="col">Material</th>
                                <th scope="col" class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="curso : ${cursos}" th:object="${curso}">
                                <td th:text="*{id}" scope="row"></td>
                                <td>
                                    <strong th:text="*{nombreCurso} ?: 'Sin nombre'"></strong>
                                </td>
                                <td>
                                    <span class="text-truncate d-inline-block" style="max-width: 300px;" 
                                          th:text="*{descripcion} ?: 'Sin descripción'"></span>
                                </td>
                                <td class="text-end">
                                    <span class="badge bg-success bg-opacity-10 text-success" 
                                          th:text="'$' + ${#numbers.formatDecimal(curso.precio, 1, 2, 'COMMA')}"
                                          th:if="*{precio != null}"></span>
                                    <span th:if="*{precio == null}" class="badge bg-secondary bg-opacity-10 text-secondary">N/A</span>
                                </td>
                                <td>
                                    <a th:href="${curso.videoUrl}" th:text="${#strings.abbreviate(curso.videoUrl, 20)}" 
                                       target="_blank" class="badge bg-primary bg-opacity-10 text-primary text-decoration-none"
                                       th:if="${curso.videoUrl != null}">
                                    </a>
                                    <span th:if="${curso.videoUrl == null}" class="badge bg-secondary bg-opacity-10 text-secondary">Sin material</span>
                                </td>
                                <td class="text-center">
                                    <div class="btn-group btn-group-sm" role="group">
                                        <a th:href="@{/cursos/{id}(id=*{id})}" 
                                           class="btn btn-outline-primary" title="Ver detalles">
                                            <i class="fas fa-eye"></i>
                                        </a>
                                        <a th:href="@{/cursos/form/{id}(id=*{id})}" 
                                           class="btn btn-outline-secondary" title="Editar">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        <a th:href="@{/cursos/delete/{id}(id=*{id})}" 
                                           class="btn btn-outline-danger" 
                                           title="Eliminar"
                                           onclick="return confirm('¿Está seguro que desea eliminar este curso?');">
                                            <i class="fas fa-trash-alt"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- Paginación -->
                <nav aria-label="Paginación de cursos" class="mt-4">
                    <ul class="pagination justify-content-center">
                        <li class="page-item disabled">
                            <a class="page-link" href="#" tabindex="-1" aria-disabled="true">Anterior</a>
                        </li>
                        <li class="page-item active" aria-current="page">
                            <a class="page-link" href="#">1</a>
                        </li>
                        <li class="page-item"><a class="page-link" href="#">2</a></li>
                        <li class="page-item"><a class="page-link" href="#">3</a></li>
                        <li class="page-item">
                            <a class="page-link" href="#">Siguiente</a>
                        </li>
                    </ul>
                </nav>
            </div>

            <!-- Mensaje cuando no hay cursos -->
            <div th:if="${cursos == null or cursos.isEmpty()}" 
                 class="text-center py-5 my-5 bg-light rounded-3">
                <i class="fas fa-book-open fa-3x mb-4" style="color: #6f42c1;"></i>
                <h3 class="mb-3">No se encontraron cursos</h3>
                <p class="lead text-muted mb-4">Actualmente no hay cursos registrados en el sistema.</p>
                <a th:href="@{/cursos/form}" class="btn btn-primary btn-lg">
                    <i class="fas fa-plus-circle me-2"></i>Crear primer curso
                </a>
            </div>
        </div>
    </main>

    <!-- Scripts específicos -->
    <th:block layout:fragment="scripts">
        <!-- Bootstrap JS Bundle with Popper -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <!-- Scripts propios de la pagina -->
        <script th:fragment="js"></script>
    </th:block>
</body>
</html>

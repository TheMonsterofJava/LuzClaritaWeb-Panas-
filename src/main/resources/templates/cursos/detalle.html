<!DOCTYPE html>
<html lang="es"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:th="http://thymeleaf.org/"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/layout}">
<head>
    <title th:text="${curso.nombreCurso}"></title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- BS 5.3 CDN CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/cursos.css}">


</head>
<body>
    <div layout:fragment="contenido">
        <div class="container py-4">
            <!-- Encabezado de la receta -->
            <div class="recipe-header text-center">
                <h1 th:text="${curso.nombreCurso}" class="display-4 fw-bold mb-3"></h1>
                <p th:text="${curso.descripcion}" class="lead mb-4"></p>
            </div>
            
            <div class="row">
                <!-- Columna principal -->
                <div class="col-lg-8">
                    <!-- Video -->
                    <div class="mb-5">
                        <h3 class="section-title">Video Tutorial</h3>
                        <div class="video-container ratio ratio-16x9" th:if="${embedUrl != null}">
                            <iframe th:src="${embedUrl}" allowfullscreen frameborder="0"
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
                        </div>
                        <div th:if="${embedUrl == null}" class="alert alert-info">
                            <i class="bi bi-info-circle"></i> Este curso no tiene video asociado o el enlace es inválido.
                        </div>
                    </div>
                    
                    <!-- Pasos -->
                    <div class="mb-5">
                        <h3 class="section-title">Preparación</h3>
                        <div class="steps-container" th:utext="${curso.pasos}"></div>
                    </div>
                </div>
                
                <!-- Sidebar -->
                <div class="col-lg-4">
                    <!-- Ingredientes -->
                    <div class="card mb-4 shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h4 class="mb-0"><i class="bi bi-list-check"></i> Ingredientes</h4>
                        </div>
                        <div class="card-body">
                            <ul class="list-group list-group-flush">
                                <li class="list-group-item ingredient-item d-flex align-items-center" 
                                    th:each="ingrediente : ${curso.ingredientes}">
                                    <i class="bi bi-check-circle-fill text-primary me-2"></i>
                                    <span th:text="${ingrediente}"></span>
                                </li>
                            </ul>
                        </div>
                    </div>
                    
                    <!-- Consejos -->
                    <div class="card mb-4 shadow-sm" th:if="${curso.consejos}">
                        <div class="card-header bg-warning text-dark">
                            <h4 class="mb-0"><i class="bi bi-lightbulb-fill"></i> Consejos del Chef</h4>
                        </div>
                        <div class="card-body tips-container" th:utext="${curso.consejos}"></div>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>

    <!-- BS5 CDN JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- Scripts propios de la pagina -->
    <script th:fragment="js"></script>
</body>
</html>

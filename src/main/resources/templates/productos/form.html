<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://thymeleaf.org/"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">

<head>
    <title th:text="${titulo}"></title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="form-body">

    <div layout:fragment="contenido" class="container-fluid py-4">
        <div class="card card-text">
            <div class="card-header">
                <h4 class="titulo-form" th:text="${titulo}"></h4>
            </div>
            <form th:action="@{/productos/guardar}" method="post" th:object="${producto}" enctype="multipart/form-data">
                <div class="card-body">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">
                            Nombre <span class="text-danger">*</span>
                        </label>
                        <input id="nombre" type="text" class="form-control" th:field="*{nombre}"
                            th:errorClass="'form-control alert-danger'" />
                        <small class="form-label text-danger" th:errors="*{nombre}"></small>
                    </div>

                    <div class="mb-3">
                        <label for="descripcion" class="form-label">
                            Descripción <span class="text-danger">*</span>
                        </label>
                        <textarea id="descripcion" class="form-control" th:field="*{descripcion}" rows="3"
                            th:errorClass="'form-control alert-danger'"></textarea>
                        <small class="form-label text-danger" th:errors="*{descripcion}"></small>
                    </div>

                    <div class="mb-3">
                        <label for="precio" class="form-label">
                            Precio <span class="text-danger">*</span>
                        </label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input id="precio" type="text" class="form-control money" th:field="*{precio}"
                                th:errorClass="'form-control alert-danger'" />
                        </div>
                        <small class="form-label text-danger" th:errors="*{precio}"></small>
                    </div>

                    <div class="mb-3">
                        <label for="stock" class="form-label">
                            Stock <span class="text-danger">*</span>
                        </label>
                        <input id="stock" type="number" min="0" class="form-control" th:field="*{stock}"
                            th:errorClass="'form-control alert-danger'" />
                        <small class="form-label text-danger" th:errors="*{stock}"></small>
                    </div>

                    <div class="mb-3">
                        <label for="imagenes" class="form-label">
                            Imágenes del producto <span class="text-danger">*</span>
                        </label>
                        <input id="imagenes" type="file" class="form-control" name="imagen" accept="image/*" />
                        <small class="form-text text-muted">Seleccione una o varias imágenes (máx. 5)</small>
                        <div id="preview-container" class="d-flex flex-wrap mt-2"></div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="categoria" class="form-label">
                            Categoría <span class="text-danger">*</span>
                        </label>
                        <select id="categoria" class="form-select" th:field="*{categoria}"
                            th:errorClass="'form-select alert-danger'">
                            <option value="">-- Seleccione una categoría --</option>
                            <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"></option>
                        </select>
                        <small class="form-label text-danger" th:errors="*{categoria}"></small>
                    </div>
                    
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="activo" th:field="*{activo}" />
                        <label class="form-check-label" for="activo">Producto activo</label>
                    </div>
                </div>
                <div class="card-footer">
                    <button type="submit" class="bi bi-floppy btn btn-outline-primary float-end ms-2">
                        Guardar
                    </button>
                    <a th:href="@{/productos/listado}" class="bi bi-x-square btn btn-outline-secondary float-end">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>

    </div>

    <!-- Scripts de Bootstrap y Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
    <!-- Scripts propios de la pagina -->
    <script th:fragment="js">
        $('.money').mask("#.##0,00", { reverse: true });
    </script>
    <script th:fragment="js">
        $('.money').mask("#.##0,00", { reverse: true });
        
        // Previsualización de imágenes
        document.getElementById('imagenes').addEventListener('change', function(e) {
            const previewContainer = document.getElementById('preview-container');
            previewContainer.innerHTML = '';
            
            const files = e.target.files;
            if (files.length > 5) {
                alert('Máximo 5 imágenes permitidas');
                this.value = '';
                return;
            }
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                if (!file.type.match('image.*')) continue;
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.style.maxWidth = '100px';
                    img.style.maxHeight = '100px';
                    img.style.margin = '5px';
                    previewContainer.appendChild(img);
                }
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>

</html>

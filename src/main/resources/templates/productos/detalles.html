<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://thymeleaf.org/"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">

<head>
    <title th:text="${titulo}"></title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts - Fuentes dulces -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" th:href="@{/css/detalles.css}">
</head>

<body>
    <div layout:fragment="contenido">
        
        <!-- Detalles del Producto -->
        <div class="container my-5">
            <div class="product-header pastry-bg">
                <div class="row align-items-center">
                    <div class="col-md-6 mb-4 mb-md-0">
                        <div class="position-relative image-container">
                            <div class="cake-decoration"></div>
                            <div class="frame-decoration">
                                <div class="corner corner-tl"></div>
                                <div class="corner corner-tr"></div>
                                <div class="corner corner-bl"></div>
                                <div class="corner corner-br"></div>
                            </div>
                            <img th:src="@{${producto.linkImagen}}" 
                                 class="img-fluid product-image pastry-shadow" 
                                 alt="Imagen del pastel"
                                 onerror="this.src='/img/default-cake.png'">
                            <span th:class="${producto.activo && producto.stock > 0} ? 
                                          'badge availability-badge available' : 
                                          'badge availability-badge unavailable'"
                                  th:text="${producto.activo && producto.stock > 0} ? 
                                          '¡Disponible!' : 'Agotado'">
                            </span>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <h1 th:text="${producto.nombre}" class="mb-3 pastry-title"></h1>
                        <div class="d-flex align-items-center mb-3">
                            <span class="badge category-badge me-2" 
                                  th:text="${producto.categoria.nombre}"></span>
                            <small class="text-muted product-code">Código: #<span th:text="${producto.id}"></span></small>
                        </div>
                        
                        <div class="price-container mb-3">
                            <div class="price-tag" th:text="'$' + ${#numbers.formatDecimal(producto.precio, 1, 2, 'COMMA')}"></div>
                            <div class="price-subtext">Precio por porción</div>
                        </div>
                        
                        <div class="product-details mb-4">
                            <div class="detail-item">
                                <i class="bi bi-people-fill"></i>
                                <span><strong>Porciones:</strong> 
                                    <span th:text="${producto.stock}"></span> disponibles
                                </span>
                            </div>
                            <div class="detail-item" th:if="${producto.activo}">
                                <i class="bi bi-check-circle-fill text-success"></i>
                                <span class="text-success">¡Recién horneado!</span>
                            </div>
                            <div class="detail-item" th:unless="${producto.activo}">
                                <i class="bi bi-x-circle-fill text-danger"></i>
                                <span class="text-danger">No disponible</span>
                            </div>
                        </div>
                        
                        <div class="d-grid gap-2 d-md-flex action-buttons">
                            <a th:href="@{/productos/listado}" class="btn btn-pastel-secondary">
                                <i class="bi bi-arrow-left"></i> Volver al menú
                            </a>
                            <button th:if="${producto.activo && producto.stock > 0}" class="btn btn-pastel-primary">
                                <i class="bi bi-cart-plus"></i> Añadir al carrito
                            </button>
                        </div>
                    </div>
                </div>
            </div>  

            <div class="row mt-4">
                <div class="col-12">
                    <div class="card detail-card">
                        <div class="card-header pastry-card-header">
                            <i class="bi bi-journal-text"></i> Descripción del Pastel
                        </div>
                        <div class="card-body">
                            <p class="card-text description-text" th:text="${producto.descripcion} ?: 'Este delicioso pastel está esperando por tu descripción...'"></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Productos Relacionados -->
            <div class="related-products pastry-section" th:if="${not #lists.isEmpty(productosRelacionados)}">
                <h3 class="mb-4 section-title"><i class="bi bi-stars"></i> Más delicias para probar</h3>
                <div class="row">
                    <div class="col-lg-3 col-md-6 mb-4" th:each="relacionado : ${productosRelacionados}">
                        <div class="card related-product-card h-100">
                            <a th:href="@{'/productos/detalle/' + ${relacionado.id}}" class="text-decoration-none">
                                <div class="position-relative">
                                    <div class="related-image-container">
                                        <img th:src="@{${relacionado.linkImagen}}" 
                                             class="card-img-top related-product-img" 
                                             alt="Producto relacionado"
                                             onerror="this.src='/img/default-cake.png'">
                                    </div>
                                    <span th:if="${!relacionado.activo || relacionado.stock <= 0}" 
                                          class="badge availability-badge unavailable">
                                        Agotado
                                    </span>
                                </div>
                                <div class="card-body">
                                    <h5 class="card-title pastry-item-title" th:text="${relacionado.nombre}"></h5>
                                    <p class="card-text price-tag-sm" 
                                       th:text="'$' + ${#numbers.formatDecimal(relacionado.precio, 1, 2, 'COMMA')}"></p>
                                </div>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/carrito.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Manejar imágenes por defecto
            document.querySelectorAll('img').forEach(img => {
                img.onerror = function() {
                    this.src = '/img/default-cake.png';
                };
            });
            
            // Efecto hover para tarjetas de productos
            document.querySelectorAll('.related-product-card').forEach(card => {
                card.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateY(-10px) scale(1.02)';
                    this.querySelector('.pastry-item-title').style.color = '#e83e8c';
                });
                card.addEventListener('mouseleave', function() {
                    this.style.transform = '';
                    this.querySelector('.pastry-item-title').style.color = '';
                });
            });
        });
    </script>
    <script th:fragment="js"></script>
</body>
</html>

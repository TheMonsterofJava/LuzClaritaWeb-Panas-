<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://thymeleaf.org/"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">

<head>
    <title th:text="${titulo}"></title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Home</title>
    <!-- BS 5.3 CDN CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        .custom-card {
            border: none;
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        }
        .custom-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }
        .custom-card img {
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
        }
        .custom-card .card-body {
            padding: 20px;
        }
        .custom-card .card-title {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            color: #333;
        }
        .custom-card .card-text {
            font-family: 'Poppins', sans-serif;
            color: #777;
        }
        .agregar-carrito {
            display: inline-block;
            padding: 10px 20px;
            background-color: #ff6f61;
            color: white;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            transition: background-color 0.3s ease-in-out;
            font-family: 'Poppins', sans-serif;
            margin-top: 10px;
        }
        .agregar-carrito:hover {
            background-color: #ff4a3d;
        }
    </style>
</head>

<body class="bg-image">

    <div layout:fragment="contenido">

        <div id="hero">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/home">Inicio</a></li>
                    <li class="breadcrumb-item active" aria-current="page"><b>Productos</b></li>
                </ol>
            </nav>
            <h2 class="titulo text-center mb-4 col-12 h1 titulo-resaltado" th:text="${titulo}">Productos</h2>
        </div>

        <main>
            <aside class="mb-5">
                <h2 class="text-center">Categorías</h2>
                <ul class="list-group" th:field="*{categoria}">
                    <li class="list-group-item" th:each="c : ${categorias}" th:value="${c.id}"><a th:text="${c.nombre}"
                            th:href="${c.id}"></a></li>
                </ul>
            </aside>

            <section class="productos mb-5">
                <div class="container mb-4">
                    <label for="sort" class="fw-bold">Ordenar por:</label>
                    <select class="form-control-sm" id="sort">
                        <option>Precio: Menor a Mayor</option>
                        <option>Precio: Mayor a Menor</option>
                        <option>Nombre: A-Z</option>
                        <option>Nombre: Z-A</option>
                    </select>
                </div>
                <div class="container mt-4">
                    <div class="d-flex flex-wrap justify-content-center">
                        <!-- Iteración de productos -->
                        <div th:each="p : ${productos}" class="col-md-4 mb-4">
                            <div class="card custom-card pastel-card shadow-lg rounded-3">
                                <img th:src="@{${p.linkImagen}}" class="card-img-top" alt="Imagen del producto">
                                <div class="card-body text-center">
                                    <h5 class="card-title" th:text="${p.descripcion}">Nombre del Producto</h5>
                                    <p class="card-text text-muted"> $<span th:text="${p.precio}">$0.00</span></p>
                                    <!-- Botón con atributos data-* -->
                                    <a href="#" class="agregar-carrito bi bi-cart4" th:data-id="${p.id}" th:data-nombre="${p.descripcion}" th:data-precio="${p.precio}" th:data-imagen="${p.linkImagen}">
                                        Añadir al Carrito
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>                
            </section>
        </main>
    </div>

    <!-- Scripts propios de la pagina -->
    <script th:fragment="js"></script>
    <script src="/js/carrito.js"></script>
</body>

</html>

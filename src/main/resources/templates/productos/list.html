<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://thymeleaf.org/"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">

<head>
    <title th:text="${titulo}"></title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Home</title>
    <!-- BS 5.3 CDN CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/productos.css}">

    <style>
        .custom-card {
            border: none;
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        }

        .custom-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .custom-card img {
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
        }

        .custom-card .card-body {
            padding: 20px;
        }

        .custom-card .card-title {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            color: #333;
        }

        .custom-card .card-text {
            font-family: 'Poppins', sans-serif;
            color: #777;
        }

        .agregar-carrito {
            display: inline-block;
            padding: 10px 20px;
            background-color: #ff6f61;
            color: white;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            transition: background-color 0.3s ease-in-out;
            font-family: 'Poppins', sans-serif;
            margin-top: 10px;
        }

        .agregar-carrito:hover {
            background-color: #ff4a3d;
        }
    </style>
</head>

<body class="bg-image">

    <div layout:fragment="contenido">

        <div id="hero">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/home">Inicio</a></li>
                    <li class="breadcrumb-item active" aria-current="page"><b>Productos</b></li>
                </ol>
            </nav>
            <h2 class="titulo text-center mb-4 col-12 h1 titulo-resaltado" th:text="${titulo}">Productos</h2>
        </div>

        <main>
           <aside class="mb-5">
                <h2 class="text-center">Categorías</h2>
                <ul class="list-group">
                    <li class="list-group-item" th:each="c : ${categorias}" th:value="${c.id}" th:classappend="${c.id == categoriaId} ? 'active'">
                        <a th:text="${c.nombre}" th:href="@{/productos/listado(categoriaId=${c.id}, sort=${sort})}"></a>
                    </li>
                </ul>
            </aside>

            <section class="productos mb-5">
                <div class="container mb-4">
                    <form th:action="@{/productos/listado}" method="get" id="sortForm" class="d-flex align-items-center">
                        <input type="hidden" name="categoriaId" th:if="${categoriaId != null}" th:value="${categoriaId}" />
                        <label for="sort" class="fw-bold me-2">Ordenar por:</label>
                        <select class="form-select form-select-sm" id="sort" name="sort" onchange="this.form.submit()" style="width: auto;">
                            <option value="precio_asc" th:selected="${sort == 'precio_asc'}">Precio: Menor a Mayor</option>
                            <option value="precio_desc" th:selected="${sort == 'precio_desc'}">Precio: Mayor a Menor</option>
                            <option value="nombre_asc" th:selected="${sort == 'nombre_asc'}">Nombre: A-Z</option>
                            <option value="nombre_desc" th:selected="${sort == 'nombre_desc'}">Nombre: Z-A</option>
                        </select>
                    </form>
                </div>
                <div class="container mt-4">
                    <div class="row justify-content-center">
                        <!-- Iteración de productos con iterador -->
                        <div th:each="p, iterStat : ${productos}" class="col-md-4 mb-4">
                            <div class="card custom-card pastel-card shadow-lg rounded-3" 
                                th:onclick="'window.location.href=\'/productos/detalle/' + ${p.id} + '\''">
                                <img th:src="@{${p.linkImagen}}" class="card-img-top" alt="Imagen del producto">
                                <div class="card-body text-center">
                                    <h5 class="card-title" th:text="${p.nombre}">Nombre del Producto</h5>
                                    <p class="card-text text-muted"> $<span th:text="${#numbers.formatDecimal(p.precio, 1, 2)}">$0.00</span></p>
                                    <a href="#" class="agregar-carrito bi bi-cart4" th:data-id="${p.id}"
                                        th:data-nombre="${p.nombre}" th:data-precio="${p.precio}"
                                        th:data-imagen="${p.linkImagen}" onclick="event.stopPropagation()">
                                        Añadir al Carrito
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Scripts propios de la pagina -->
    <script th:fragment="js"></script>
    <!-- El script de ordenamiento fue reemplazado por un formulario con onchange="this.form.submit()" -->
    <script src="/js/carrito.js"></script>
</body>

</html>

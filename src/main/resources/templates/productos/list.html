<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://thymeleaf.org/"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">

<head>
    <title th:text="${titulo}"></title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- BS 5.3 CDN CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="@{/css/productos.css}">
    <!-- Iconos Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-image">

    <div layout:fragment="contenido">

        <div id="hero">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/home">Inicio</a></li>
                    <li class="breadcrumb-item active" aria-current="page"><b>Productos</b></li>
                </ol>
            </nav>
            <h2 class="titulo text-center mb-4 col-12 h1 titulo-resaltado" th:text="${titulo}">Productos</h2>
        </div>

        <main>
            <aside class="mb-5">
                <h2 class="text-center">Categorías</h2>
                <ul class="list-group">
                    <li class="list-group-item" th:each="c : ${categorias}" th:value="${c.id}">
                        <a th:text="${c.nombre}" th:href="${c.id}"></a>
                    </li>
                </ul>
            </aside>

            <section class="productos mb-5">
                <div class="container mb-4">
                    <label for="sort" class="fw-bold">Ordenar por:</label>
                    <select class="form-control-sm" id="sort">
                        <option>Precio: Menor a Mayor</option>
                        <option>Precio: Mayor a Menor</option>
                        <option>Nombre: A-Z</option>
                        <option>Nombre: Z-A</option>
                    </select>
                </div>
                <div class="container mt-4">
                    <div class="d-flex flex-wrap justify-content-center">
                        <!-- Iteración de productos -->
                        <div th:each="p : ${productos}" class="col-md-4 mb-4">
                            <div class="card custom-card pastel-card shadow-lg rounded-3">
                                <!-- Enlace a la vista detallada en la imagen y título -->
                                <!-- Dentro del bucle de productos -->
                                <a th:href="@{'/productos/detalle/' + ${p.id}}" class="text-decoration-none text-dark">
                                    <img th:src="@{${p.linkImagen}}" class="card-img-top" alt="Imagen del producto">
                                    <div class="card-body text-center">
                                        <h5 class="card-title" th:text="${p.nombre}">Nombre del Producto</h5>
                                        <p class="card-text text-muted"> $<span th:text="${p.precio}">$0.00</span></p>
                                    </div>
                                </a>

                                <!-- Y para el botón de detalles -->
                                <a th:href="@{'/productos/detalle/' + ${p.id}}" class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-eye-fill"></i> Ver Detalles
                                </a>
                                        <!-- Botón para añadir al carrito -->
                                        <a href="#" class="btn btn-sm btn-outline-success agregar-carrito" 
                                           th:data-id="${p.id}"
                                           th:data-nombre="${p.descripcion}"
                                           th:data-precio="${p.precio}"
                                           th:data-imagen="${p.linkImagen}">
                                            <i class="bi bi-cart-plus"></i> Añadir
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>                
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/carrito.js}"></script>
</body>
</html>

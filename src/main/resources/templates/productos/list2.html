<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin}">
<head>
    <title th:text="${titulo}"></title>
    <!-- BS 5.3 CDN CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    
    <th:block layout:fragment="styles">
        <!-- Estilos específicos para esta página -->
         <style>
            html, body {
                height: 100%;
                margin: 0;
                padding: 0;
            }
            
            .main-content {
                min-height: 100vh;
            }
         </style>
    </th:block>
</head>
<body>

    <!-- Contenido principal -->
    <div layout:fragment="content" class="main-content">
        <div class="container-fluid">
            <div class="card my-4 card-text">
                <div class="card-header bg-primary text-white">
                    <h5 class="titulo-form" th:text="${titulo}"></h5>
                </div>
                <div class="card-body">
                    <!-- Mensajes de éxito o error -->
                    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show mt-3" role="alert">
                        <span th:text="${mensajeExito}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
                        <span th:text="${mensajeError}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    <!-- Mensaje de eliminación (rojo) -->
                    <div th:if="${mensajeEliminar}" class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
                        <span th:text="${mensajeEliminar}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <table id="tabla-productos" class="table table-striped table-hover table-bordered table-responsive" style="width: 100%;">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Imagen</th>
                                <th>Nombre</th>
                                <th>Precio</th>
                                <th>Cantidad</th>
                                <th>Categoria</th>
                                <th>Opciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${productos}" th:class="${not p.activo} ? 'tachado' : ''">
                                <td th:text="${p.id}"></td>
                                <td>
                                    <img th:src="@{${p.linkImagen}}" alt="Foto" height="100px">
                                </td>
                                <td th:text="${p.nombre}"></td>
                                <td th:text="${p.precio}"></td>
                                <td th:text="${p.stock}"></td>
                                <td th:text="${p.categoria}"></td>
                                <td>
                                    <a th:href="@{/productos/editar/} + ${p.id}" class="bi bi-pencil btn btn-sm btn-warning"> Editar</a>
                                    <a th:href="@{/productos/eliminar/{id}(id=${p.id})}" 
                                    class="bi bi-trash btn btn-sm btn-danger"
                                    onclick="return confirm('¿Seguro que desea eliminar este producto?');">
                                    Eliminar
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <th>#</th>
                                <th>Imagen</th>
                                <th>Nombre</th>
                                <th>Precio</th>
                                <th>Cantidad</th>
                                <th>Categoria</th>
                                <th>Opciones</th>
                            </tr>
                        </tfoot>
                    </table>
                </div>
                <div class="card-footer">
                    <a th:href="@{/productos/nuevo}" class="bi bi-plus-circle btn btn-outline-primary float-end">
                        Añadir producto
                    </a>
                    <!-- Botón para abrir el modal de añadir categoría -->
                    <button type="button" class="bi bi-plus-square btn btn-outline-success float-end me-2" data-bs-toggle="modal" data-bs-target="#modalCategoria">
                        Administrar categorias
                    </button>
                </div>
            </div>

            <!-- Modal para añadir o eliminar una categoría -->
            <div class="modal fade" id="modalCategoria" tabindex="-1" aria-labelledby="modalCategoriaLabel" aria-hidden="true">
                <div class="modal-dialog modal-lg">
                    <div class="modal-content rounded-4 shadow-lg">
                        <div class="modal-header bg-light pink-bg">
                            <h5 class="modal-title" id="modalCategoriaLabel" style="font-family: 'Pacifico', cursive; color: #e52b50;">Gestionar Categorías</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body" style="background-color: #f8f0f0;">
                            <!-- Formulario para agregar una nueva categoría -->
                            <form th:action="@{/categorias/guardar}" method="post" th:object="${categoria}">
                                <div class="mb-4">
                                    <label for="nombre" class="form-label" style="font-family: 'Pacifico', cursive; font-size: 1.1rem; color: #7b3f3f;">Nombre de la categoría</label>
                                    <input type="text" class="form-control border-2 border-pink" id="nombre" th:field="*{nombre}" placeholder="Escribe el nombre de la categoría" required>
                                </div>
                                <button type="submit" class="bi bi-check-circle-fill btn btn-lg btn-danger w-100" style="background-color: #00770e; border-color: #00770e; font-size: 15px;"> Guardar</button>
                            </form>

                            <hr class="my-4" style="border-top: 2px solid #e52b50;">

                            <!-- Formulario para eliminar una categoría existente -->
                            <h5 class="mt-4" style="font-family: 'Pacifico', cursive; color: #7b3f3f;">Eliminar Categoría</h5>
                            <form th:action="@{/categorias/eliminar}" method="post">
                                <div class="mb-4">
                                    <label for="categoriaEliminar" class="form-label" style="font-size: 1.1rem; color: #7b3f3f;">Selecciona una categoría para eliminar</label>
                                    <select class="form-select border-2 border-pink" id="categoriaEliminar" name="categoriaId" required>
                                        <option value="" disabled selected>Elige una categoría</option>
                                        <!-- Listado de categorías -->
                                        <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"></option>
                                    </select>
                                </div>
                                <button type="submit" class="bi bi-trash btn btn-lg btn-danger w-100" style="background-color: #e52b50; border-color: #e52b50;  font-size: 15px;"> Eliminar</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- Scripts específicos -->
    <th:block layout:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script th:src="@{/js/productos-list.js}"></script>
    </th:block>
</body>
</html>

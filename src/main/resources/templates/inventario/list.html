<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!--Jquery para Datatable-->
    <!-- <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> -->

    <!-- Datatable -->   
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.12.1/css/jquery.dataTables.min.css">

    <title th:text="${titulo}"></title>
</head>

<body class="form-body">
    <div layout:fragment="contenido" class="container-fluid py-4">

        <div class="card card-text">
            <div class="card-header">
                <h4 class="card-title" th:text="${titulo}">Inventario</h4>
            </div>
            <div class="card-body shadow p-3 mb-5 bg-body rounded">
                <div class="table-responsive">
                    <table id="tabla-inventario" class="table table-striped table-hover table-bordered shadow p-3 mb-5 bg-body rounded">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Ingrediente</th>
                                <th>Unidad</th>
                                <th>Precio</th>
                                <th>Cantidad</th>
                                <th>Fecha de Ingreso</th>
                                <th>Fecha de Vencimiento</th>
                                <th>ID Proveedor</th>
                                <th>ID Usuario</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="i : ${inventarioList}" th:class="${not i.activo} ? 'tachado' : ''">
                                <td th:text="${i.id}"></td>
                                <td th:text="${i.nombreIngrediente}"></td>
                                <td th:text="${i.unidadMedida}"></td>
                                <td th:text="${i.precio}"></td>
                                <td th:text="${i.cantidad}"></td>
                                <td th:text="${i.fechaIngreso}"></td>
                                <td th:text="${i.fechaVencimiento}"></td>
                                <td th:text="${i.proveedor.nombre}"></td>
                                <td th:text="${i.usuario.nomb_usu}"></td>
                                <td style="max-width: 35px;">
                                    <a th:href="@{/inventario/editar/} + ${i.id}" class="btn btn-sm btn-warning">Editar</a>
                                    <a th:href="@{/inventario/borrar/} + ${i.id}" class="btn btn-sm btn-danger"
                                        onclick="return confirm('¿Deshabilitar el Producto?');">Borrar
                                        <span th:text="${not i.activo} ? 'Habilitar : Deshabilitar'"></span>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="btn-group float-end" role="group" aria-label="Basic outlined example">
                        <a th:href="@{/inventario/nuevo}" class="btn btn-outline-primary float-end">
                            Nuevo ingrediente
                        </a>
                        <a th:href="@{/proveedor/listado}" class="btn btn-outline-primary">
                            Nuevo proveedor
                        </a>
                    </div>
                </div> 
            </div>
        </div>
    </div>
    <script th:fragment="js"></script>
    <script th:fragment="js" th:src="@{/js/inventario-list.js}"></script>
    <script type="text/javascript" src="https://cdn.datatables.net/1.12.1/js/jquery.dataTables.min.js"></script>

</body>
</html>

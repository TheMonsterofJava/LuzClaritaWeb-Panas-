<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://thymeleaf.org/"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">

<head>
    <title th:text="${titulo}"></title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

    <div layout:fragment="contenido">
        <div class="container mt-5">
            <h2 class="titulo text-center mb-4" th:text="${titulo}"></h2>

            <div th:if="${facturas.isEmpty()}" class="alert alert-info text-center" role="alert">
                Aún no has realizado ninguna compra.
            </div>

            <div th:if="${!facturas.isEmpty()}" class="table-responsive">
                <table class="table table-striped table-hover shadow-sm">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col">N° de Factura</th>
                            <th scope="col">Fecha de Compra</th>
                            <th scope="col">Método de Pago</th>
                            <th scope="col">Total</th>
                            <th scope="col">Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="factura : ${facturas}">
                            <td th:text="${factura.numero_factura}"></td>
                            <td th:text="${#temporals.format(factura.fechapedido, 'dd/MM/yyyy HH:mm')}"></td>
                            <td th:text="${factura.metodo_pago}"></td>
                            <td th:text="|${#numbers.formatCurrency(factura.calcularTotal())}|"></td>
                            <td>
                                <span th:if="${factura.activo}" class="badge bg-success">Completada</span>
                                <span th:unless="${factura.activo}" class="badge bg-danger">Cancelada</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
             <div class="text-center mt-4">
                <a th:href="@{/home}" class="btn btn-secondary">Volver al inicio</a>
            </div>
        </div>
    </div>
    <script th:fragment="js"></script>
</body>
</html>

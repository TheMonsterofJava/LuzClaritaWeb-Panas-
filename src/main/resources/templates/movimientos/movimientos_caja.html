<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Movimientos de Caja</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <link rel="stylesheet" href="/css/movimientos.css">
</head>

<body>
    <!-- Contenido principal -->
    <div layout:fragment="content" class="main-content">
        <!-- Encabezado -->
        <div class="dashboard-header">
            <div class="container">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h1 class="header-title">Movimientos de Caja</h1>
                        <p class="header-subtitle">Registro detallado de transacciones financieras</p>
                    </div>
                    <div>
                        <span class="badge bg-light text-dark">
                            <i class="bi bi-calendar me-1"></i>
                            <span th:text="${#temporals.format(fechaInicio, 'dd/MM/yyyy') + ' - ' + #temporals.format(fechaFin, 'dd/MM/yyyy')}"></span>
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <div class="container py-2">
            <!-- Tarjetas de resumen -->
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <div class="summary-card card-ingresos">
                        <div class="card-body">
                            <div class="d-flex align-items-center">
                                <div class="me-3 text-success">
                                    <i class="bi bi-arrow-down-circle summary-icon"></i>
                                </div>
                                <div>
                                    <h3 class="summary-title">Total Ingresos</h3>
                                    <p class="summary-value text-success" 
                                    th:text="${resumen != null ? ('$' + #numbers.formatDecimal(resumen.get('ingresos'), 1, 2, 'COMMA')) : '$0.00'}">
                                        $0.00
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="summary-card card-egresos">
                        <div class="card-body">
                            <div class="d-flex align-items-center">
                                <div class="me-3 text-danger">
                                    <i class="bi bi-arrow-up-circle summary-icon"></i>
                                </div>
                                <div>
                                    <h3 class="summary-title">Total Egresos</h3>
                                    <p class="summary-value text-danger" 
                                    th:text="${resumen != null ? ('$' + #numbers.formatDecimal(resumen.get('egresos'), 1, 2, 'COMMA')) : '$0.00'}">
                                        $0.00
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="summary-card card-saldo">
                        <div class="card-body">
                            <div class="d-flex align-items-center">
                                <div class="me-3 text-info">
                                    <i class="bi bi-wallet2 summary-icon"></i>
                                </div>
                                <div>
                                    <h3 class="summary-title">Saldo Actual</h3>
                                    <p class="summary-value text-info" 
                                    th:text="${resumen != null ? ('$' + #numbers.formatDecimal(resumen.get('saldo'), 1, 2, 'COMMA')) : '$0.00'}">
                                        $0.00
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Filtros -->
            <div class="filters-card mb-4">
                <form th:action="@{/caja/movimientos}" method="get">
                    <div class="row g-3 align-items-end">
                        <div class="col-md-4">
                            <label class="filter-label">Fecha Inicio</label>
                            <input type="date" class="form-control form-control-sm" 
                                th:value="${#temporals.format(fechaInicio, 'yyyy-MM-dd')}" 
                                name="fechaInicio" required>
                        </div>
                        <div class="col-md-4">
                            <label class="filter-label">Fecha Fin</label>
                            <input type="date" class="form-control form-control-sm" 
                                th:value="${#temporals.format(fechaFin, 'yyyy-MM-dd')}" 
                                name="fechaFin" required>
                        </div>
                        <div class="col-md-4">
                            <button type="submit" class="filter-btn w-100">
                                <i class="bi bi-funnel me-1"></i> Filtrar
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Tabla de movimientos -->
            <div class="data-table mb-5">
                <div class="table-header">
                    <div class="d-flex justify-content-between align-items-center">
                        <h5 class="table-title">
                            <i class="bi bi-table me-2"></i> Detalle de Transacciones
                        </h5>
                        <a th:if="${cajaId != null}"
                            th:href="@{/caja/exportar/pdf(cajaId=${cajaId}, fechaInicio=${#temporals.format(fechaInicio, 'yyyy-MM-dd')}, fechaFin=${#temporals.format(fechaFin, 'yyyy-MM-dd')})}"
                            class="export-btn" target="_blank">
                            <i class="bi bi-file-earmark-pdf"></i> Exportar
                        </a>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table mb-0">
                        <thead>
                            <tr>
                                <th class="text-center">Fecha/Hora</th>
                                <th>Tipo</th>
                                <th class="text-end">Monto</th>
                                <th>Descripción</th>
                                <th>Responsable</th>
                                <th>Origen</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="movement-row" th:each="mov : ${movimientos}">
                                <td class="text-center" th:text="${#temporals.format(mov.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                                <td>
                                    <span class="movement-type" 
                                        th:classappend="${mov.tipoOperacion.name() == 'INGRESO'} ? 'type-ingreso' : 'type-egreso'"
                                        th:text="${mov.tipoOperacion.name()}"></span>
                                </td>
                                <td class="text-end movement-amount" 
                                    th:classappend="${mov.tipoOperacion.name() == 'INGRESO'} ? 'text-success' : 'text-danger'"
                                    th:text="${'$' + #numbers.formatDecimal(mov.monto, 1, 2, 'COMMA')}"></td>
                                <td th:text="${mov.descripcion != null ? mov.descripcion : '-'}"></td>
                                <td th:text="${mov.operador != null ? mov.operador.nomb_usu : 'Sistema'}"></td>
                                <td th:switch="${true}" data-bs-toggle="tooltip"
                                    th:title="${mov.compra != null ? 'ID Compra: ' + mov.compra.id : 
                                            (mov.factura != null ? 'ID Factura: ' + mov.factura.id + ' / N°: ' + mov.factura.numero_factura :
                                            (mov.venta != null ? 'ID Venta: ' + mov.venta.id : 'Sin origen específico'))}">
                                    <span th:case="${mov.compra != null}" class="badge bg-info badge-origin">
                                        <i class="bi bi-bag-check me-1"></i>
                                        <span th:text="'Compra'"></span>
                                    </span>
                                    <span th:case="${mov.factura != null}" class="badge bg-success badge-origin">
                                        <i class="bi bi-receipt me-1"></i>
                                        <span th:text="'Factura'"></span>
                                    </span>
                                    <span th:case="${mov.venta != null}" class="badge bg-warning text-dark badge-origin">
                                        <i class="bi bi-cart3 me-1"></i>
                                        <span th:text="'Venta'"></span>
                                    </span>
                                    <span th:case="*" class="badge bg-secondary badge-origin">N/A</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="p-3 border-top">
                    <div class="d-flex justify-content-between align-items-center">
                        <small class="text-muted" th:text="'Mostrando ' + ${movimientos.size()} + ' registros'"></small>
                        <small class="text-muted" th:text="'Generado el ' + ${#temporals.format(#temporals.createNow(), 'dd/MM/yyyy HH:mm')}"></small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts específicos -->
    <th:block layout:fragment="scripts">
        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>

        <!-- SweetAlert2 JS -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

        <script>
            document.addEventListener('DOMContentLoaded', function() {
                // Inicializar tooltips
                const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
                const tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
                    return new bootstrap.Tooltip(tooltipTriggerEl, {
                        trigger: 'hover'
                    });
                });
                
                // Verificar si hay mensajes flash
                const successMessage = /*[[${success}]]*/ null;
                if (successMessage) {
                    Swal.fire({
                        title: 'Éxito',
                        text: successMessage,
                        icon: 'success',
                        confirmButtonColor: 'var(--primary)',
                        timer: 3000,
                        timerProgressBar: true,
                        toast: true,
                        position: 'top-end',
                        showConfirmButton: false
                    });
                }
                
                const errorMessage = /*[[${error}]]*/ null;
                if (errorMessage) {
                    Swal.fire({
                        title: 'Error',
                        text: errorMessage,
                        icon: 'error',
                        confirmButtonColor: 'var(--primary)'
                    });
                }
            });
        </script>
    </th:block>
</body>
</html>

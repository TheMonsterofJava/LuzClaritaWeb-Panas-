<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Administración de Cajas'"></title>
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.12.1/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="text/javascript" src="https://cdn.datatables.net/1.12.1/js/jquery.dataTables.min.js"></script>
</head>

<body>
    <div layout:fragment="contenido" class="container-fluid py-4">
        <div class="card shadow p-3 mb-5 bg-body rounded">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Administración de Cajas</h4>
            </div>
            <div class="card-body">
                <div th:if="${success}" class="alert alert-success" role="alert" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
                <div class="table-responsive">
                    <table id="tabla-cajas"
                        class="table table-striped table-hover table-bordered shadow p-3 mb-5 bg-body rounded">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Fecha Apertura</th>
                                <th>Usuario</th>
                                <th>Saldo Inicial</th>
                                <th>Saldo Final</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="caja : ${cajas}">
                                <td th:text="${caja.id}"></td>
                                <td th:text="${#temporals.format(caja.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                                <td th:text="${caja.usuario != null ? caja.usuario.nomb_usu : '-'}"></td>
                                <td th:text="${'$' + #numbers.formatDecimal(caja.saldoInicial, 1, 2)}"></td>
                                <td th:text="${'$' + #numbers.formatDecimal(caja.saldoFinal, 1, 2)}"></td>
                                <td>
                                    <span th:classappend="${caja.estado.name() == 'ABIERTA'} ? 'badge bg-success' : 'badge bg-secondary'"
                                          th:text="${caja.estado.name()}"></span>
                                </td>
                                <td>
                                    <a th:href="@{/caja/detalle/{id}(id=${caja.id})}" class="btn btn-outline-primary btn-sm">
                                        <i class="bi bi-eye"></i> Detalle
                                    </a>
                                    <a th:if="${caja.estado.name() == 'ABIERTA'}"
                                        th:href="@{/caja/cerrar/{id}(id=${caja.id})}"
                                        class="btn btn-outline-danger btn-sm"
                                        onclick="return confirm('¿Seguro que quieres cerrar esta caja?');">
                                        <i class="bi bi-lock"></i> Cerrar
                                    </a>
                                    <a th:if="${caja.estado.name() == 'CERRADA'}"
                                        th:href="@{/caja/abrir/{id}(id=${caja.id})}"
                                        class="btn btn-outline-success btn-sm"
                                        onclick="return confirm('¿Seguro que quieres abrir esta caja?');">
                                        <i class="bi bi-unlock"></i> Abrir
                                    </a>
                                    <a th:href="@{/caja/movimientos?cajaId={id}(id=${caja.id})}" class="btn btn-outline-info btn-sm">
                                        <i class="bi bi-list"></i> Movimientos
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-3">
                        <a th:href="@{/caja/nueva}" class="btn btn-primary">
                            <i class="bi bi-plus-circle"></i> Abrir nueva caja
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script th:inline="javascript">
        $(document).ready(function () {
            $('#tabla-cajas').DataTable({
                "language": {
                    "url": "//cdn.datatables.net/plug-ins/1.12.1/i18n/es-ES.json"
                },
                "order": [ [ 0, 'desc' ] ]
            });
        });
    </script>

    <script th:fragment="js">
        
    </script>
</body>

</html>

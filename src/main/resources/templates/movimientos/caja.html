<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Administración de Cajas'"></title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css">
    
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    
    <!-- Estilos personalizados -->
    <style>
        .card-header {
            border-bottom: none;
            padding: 1.5rem;
        }
        .table th {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            color: #6c757d;
            background-color: #f8f9fa;
        }
        .badge {
            font-weight: 500;
            padding: 0.5em 0.75em;
        }
        .btn-sm {
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            border-radius: 0.25rem;
            margin-right: 0.25rem;
            margin-bottom: 0.25rem;
        }
        .table-responsive {
            border-radius: 0.5rem;
            overflow: hidden;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
        .dataTables_wrapper .dataTables_info {
            padding-left: 1.5rem;
        }
        .dataTables_wrapper .dataTables_paginate {
            padding-right: 1.5rem;
        }
        .action-buttons {
            white-space: nowrap;
        }
        .currency {
            font-family: 'Courier New', monospace;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <!-- Contenido principal -->
    <div layout:fragment="content" class="main-content">
        <div class="container-fluid py-4">
            <div class="card border-0 shadow">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h4 class="mb-0" th:text="${titulo}">Administración de Caja</h4>
                    <a th:href="@{/caja/nueva}" class="btn btn-light btn-sm">
                        <i class="bi bi-plus-circle me-1"></i> Nueva Caja
                    </a>
                </div>
                
                <div class="card-body">
                    <!-- Alertas -->
                    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        <span th:text="${success}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    
                    <!-- Tabla -->
                    <div class="table-responsive">
                        <table id="tabla-cajas" class="table table-hover align-middle" style="width:100%">
                            <thead class="table-light">
                                <tr>
                                    <th>#</th>
                                    <th>Fecha Apertura</th>
                                    <th>Usuario</th>
                                    <th class="text-end">Saldo Inicial</th>
                                    <th class="text-end">Saldo Final</th>
                                    <th>Estado</th>
                                    <th class="action-buttons">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="caja : ${cajas}">
                                    <td th:text="${caja.id}" class="fw-semibold"></td>
                                    <td th:text="${#temporals.format(caja.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                                    <td th:text="${caja.usuario != null ? caja.usuario.nomb_usu : '-'}"></td>
                                    <td class="text-end currency" th:text="${'$' + #numbers.formatDecimal(caja.saldoInicial, 1, 2, 'COMMA')}"></td>
                                    <td class="text-end currency" th:text="${'$' + #numbers.formatDecimal(caja.saldoFinal, 1, 2, 'COMMA')}"></td>
                                    <td>
                                        <span th:classappend="${caja.estado.name() == 'ABIERTA'} ? 'badge bg-success' : 'badge bg-secondary'"
                                              th:text="${caja.estado.name()}"></span>
                                    </td>
                                    <td class="action-buttons">
                                        <div class="d-flex flex-wrap">
                                            <a th:href="@{/caja/detalle/{id}(id=${caja.id})}"
                                               class="btn btn-outline-primary btn-sm"
                                               data-bs-toggle="tooltip" data-bs-title="Ver detalle">
                                                <i class="bi bi-eye"></i>
                                            </a>
                                            
                                            <a th:if="${caja.estado.name() == 'ABIERTA'}"
                                               th:href="@{/caja/cerrar/{id}(id=${caja.id})}"
                                               class="btn btn-outline-danger btn-sm"
                                               data-bs-toggle="tooltip" data-bs-title="Cerrar caja"
                                               onclick="return confirm('¿Seguro que quieres cerrar esta caja?');">
                                                <i class="bi bi-lock"></i>
                                            </a>
                                            
                                            <a th:if="${caja.estado.name() == 'CERRADA'}"
                                               th:href="@{/caja/abrir/{id}(id=${caja.id})}"
                                               class="btn btn-outline-success btn-sm"
                                               data-bs-toggle="tooltip" data-bs-title="Abrir caja"
                                               onclick="return confirm('¿Seguro que quieres abrir esta caja?');">
                                                <i class="bi bi-unlock"></i>
                                            </a>
                                            
                                            <a th:href="@{/caja/movimientos?cajaId={id}(id=${caja.id})}"
                                               class="btn btn-outline-info btn-sm"
                                               data-bs-toggle="tooltip" data-bs-title="Ver movimientos">
                                                <i class="bi bi-list-ul"></i>
                                            </a>
                                            
                                            <button type="button" class="btn btn-outline-danger btn-sm"
                                                    th:onclick="'intentarDesactivarCaja(' + ${caja.id} + ');'"
                                                    data-bs-toggle="tooltip" data-bs-title="Eliminar caja">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <th:block layout:fragment="scripts">
        <!-- jQuery -->
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        
        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        
        <!-- DataTables JS -->
        <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
        <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
        
        <!-- SweetAlert2 -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
        
        <!-- Scripts personalizados -->
        <script>
            $(document).ready(function () {
                // Inicializar DataTable
                $('#tabla-cajas').DataTable({
                    language: {
                        decimal: ",",
                        emptyTable: "No hay datos disponibles",
                        info: "Mostrando _START_ a _END_ de _TOTAL_ registros",
                        infoEmpty: "Mostrando 0 a 0 de 0 registros",
                        infoFiltered: "(filtrado de _MAX_ registros totales)",
                        lengthMenu: "Mostrar _MENU_ registros",
                        loadingRecords: "Cargando...",
                        search: "Buscar:",
                        zeroRecords: "No se encontraron registros coincidentes",
                        paginate: {
                            first: "Primero",
                            last: "Último",
                            next: "Siguiente",
                            previous: "Anterior"
                        }
                    },
                    order: [[0, 'desc']],
                    responsive: true,
                    dom: '<"top"lf>rt<"bottom"ip>',
                    pageLength: 10
                });
                
                // Inicializar tooltips
                const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
                tooltipTriggerList.map(function (tooltipTriggerEl) {
                    return new bootstrap.Tooltip(tooltipTriggerEl);
                });
            });
            
            function intentarDesactivarCaja(cajaId) {
                Swal.fire({
                    title: 'Confirmar eliminación',
                    text: '¿Está seguro que desea eliminar esta caja?',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#d33',
                    cancelButtonColor: '#3085d6',
                    confirmButtonText: 'Sí, eliminar',
                    cancelButtonText: 'Cancelar'
                }).then((result) => {
                    if (result.isConfirmed) {
                        $.ajax({
                            url: '/caja/tiene-movimientos/' + cajaId,
                            type: 'GET',
                            success: function (response) {
                                if (response.tieneMovimientos === false) {
                                    confirmarEliminacion(cajaId);
                                } else if (response.tieneMovimientos === true) {
                                    solicitarContrasenaAdmin(cajaId);
                                } else {
                                    Swal.fire('Error', 'Respuesta inesperada del servidor', 'error');
                                }
                            },
                            error: function (xhr) {
                                Swal.fire('Error', 'No se pudo verificar el estado de la caja', 'error');
                                console.error(xhr.responseText);
                            }
                        });
                    }
                });
            }
            
            function confirmarEliminacion(cajaId) {
                Swal.fire({
                    title: '¿Eliminar Caja?',
                    text: "Esta caja no tiene movimientos. ¿Está seguro que desea eliminarla?",
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonColor: '#d33',
                    cancelButtonColor: '#3085d6',
                    confirmButtonText: 'Sí, eliminar',
                    cancelButtonText: 'Cancelar'
                }).then((result) => {
                    if (result.isConfirmed) {
                        eliminarCaja(cajaId);
                    }
                });
            }
            
            function solicitarContrasenaAdmin(cajaId) {
                Swal.fire({
                    title: 'Confirmación requerida',
                    html: `Esta caja tiene movimientos asociados.<br>Ingrese la contraseña de administrador para continuar:`,
                    icon: 'warning',
                    input: 'password',
                    inputPlaceholder: 'Contraseña de administrador',
                    showCancelButton: true,
                    confirmButtonText: 'Confirmar',
                    cancelButtonText: 'Cancelar',
                    inputValidator: (value) => {
                        if (!value) {
                            return 'Debe ingresar la contraseña';
                        }
                    }
                }).then((result) => {
                    if (result.isConfirmed) {
                        eliminarCajaAdmin(cajaId, result.value);
                    }
                });
            }
            
            function eliminarCaja(cajaId) {
                $.ajax({
                    url: '/caja/eliminar/' + cajaId,
                    type: 'GET',
                    success: function () {
                        Swal.fire('¡Eliminada!', 'La caja ha sido eliminada correctamente.', 'success')
                            .then(() => location.reload());
                    },
                    error: function (xhr) {
                        Swal.fire('Error', 'No se pudo eliminar la caja: ' + xhr.responseText, 'error');
                    }
                });
            }
            
            function eliminarCajaAdmin(cajaId, password) {
                $.ajax({
                    url: '/caja/desactivar-admin/' + cajaId,
                    type: 'POST',
                    data: { password: password },
                    success: function (response) {
                        if (response.success) {
                            Swal.fire('¡Eliminada!', response.message || 'La caja ha sido eliminada.', 'success')
                                .then(() => location.reload());
                        } else {
                            Swal.fire('Error', response.message || 'No se pudo eliminar la caja.', 'error');
                        }
                    },
                    error: function (xhr) {
                        let errorMessage = 'Error desconocido';
                        try {
                            const response = JSON.parse(xhr.responseText);
                            errorMessage = response.message || errorMessage;
                        } catch (e) {
                            errorMessage = xhr.responseText || errorMessage;
                        }
                        Swal.fire('Error', errorMessage, 'error');
                    }
                });
            }
        </script>
    </th:block>
</body>
</html>

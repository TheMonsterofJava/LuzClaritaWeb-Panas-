<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title th:text="'Detalle de Caja #' + ${caja.id}">Detalle de Caja</title>
</head>
<body>
<div layout:fragment="contenido" class="container py-4">
    <div class="card shadow p-3 mb-5 bg-body rounded">
        <div class="card-header bg-info text-white">
            <h4 class="mb-0" th:text="'Detalle de Caja #' + ${caja.id}"></h4>
        </div>
        <div class="card-body">
            <dl class="row">
                <dt class="col-sm-3">Fecha de Apertura:</dt>
                <dd class="col-sm-9" th:text="${#temporals.format(caja.fecha, 'dd/MM/yyyy HH:mm')}"></dd>

                <dt class="col-sm-3">Usuario:</dt>
                <dd class="col-sm-9" th:text="${caja.usuario != null ? caja.usuario.nomb_usu : '-'}"></dd>

                <dt class="col-sm-3">Saldo Inicial:</dt>
                <dd class="col-sm-9" th:text="${'$' + #numbers.formatDecimal(caja.saldoInicial, 1, 2)}"></dd>

                <dt class="col-sm-3">Saldo Final:</dt>
                <dd class="col-sm-9" th:text="${'$' + #numbers.formatDecimal(caja.saldoFinal, 1, 2)}"></dd>

                <dt class="col-sm-3">Estado:</dt>
                <dd class="col-sm-9">
                    <span th:classappend="${caja.estado.name() == 'ABIERTA'} ? 'badge bg-success' : 'badge bg-secondary'"
                          th:text="${caja.estado.name()}"></span>
                </dd>
            </dl>
            <h5 class="mt-4">Movimientos de esta caja</h5>
            <div class="table-responsive">
                <table class="table table-striped table-bordered">
                    <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Tipo</th>
                        <th>Monto</th>
                        <th>Descripción</th>
                        <th>Operador</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="mov : ${movimientos}">
                        <td th:text="${#temporals.format(mov.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${mov.tipoOperacion.name()}"
                            th:classappend="${mov.tipoOperacion.name() == 'INGRESO'} ? 'text-success' : 'text-danger'"></td>
                        <td th:text="${'$' + #numbers.formatDecimal(mov.monto, 1, 2)}"></td>
                        <td th:text="${mov.descripcion}"></td>
                        <td th:text="${mov.operador != null ? mov.operador.nomb_usu : '-'}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="d-flex justify-content-end">
                <a th:href="@{/caja/listado}" class="btn btn-outline-secondary">Volver</a>
            </div>
        </div>
    </div>
</div>
<script th:fragment="js"></script>
</body>
</html>

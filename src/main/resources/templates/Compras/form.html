<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}"></title>
</head>

<body>
    <div layout:fragment="contenido" class="container-fluid py-4">
        <!-- Template oculto para opciones de ingredientes -->
        <div id="ingredientes-options" style="display: none;">
            <option th:each="ing : ${ingredientes}" th:value="${ing.id}"
                th:text="${ing.nombreIngrediente} + ' (' + ${ing.unidadMedida} + ')'"></option>
        </div>

        <div class="card shadow p-3 mb-5 bg-body rounded">
            <div class="card-header">
                <h4 class="text-primary" th:text="${titulo}"></h4>
            </div>

            <form id="formCompra" th:action="@{/compras/guardar}" method="post" th:object="${compra}">
                <input type="hidden" th:field="*{id}" />

                <div class="card-body">
                    <!-- Sección de proveedor -->
                    <div class="form mb-3">
                        <label for="proveedor" class="form-label">Proveedor</label>
                        <select id="proveedor" class="form-select" th:field="*{proveedor.id}">
                            <option value="">Seleccione un proveedor</option>
                            <option th:each="prov : ${proveedores}" th:value="${prov.id}" th:text="${prov.nombre}"
                                th:selected="${compra.proveedor != null and compra.proveedor.id == prov.id}"></option>
                        </select>
                        <small class="form-label text-danger" th:errors="*{proveedor}"></small>
                    </div>

                    <!-- Sección de caja -->
                    <div class="form mb-3">
                        <label for="caja" class="form-label">Caja</label>
                        <select id="caja" class="form-select" th:field="*{caja.id}">
                            <option value="">Seleccione una caja abierta</option>
                            <option th:each="c : ${cajasAbiertas}" th:value="${c.id}" th:text="'Caja #' + ${c.id}"
                                th:selected="${compra.caja != null and compra.caja.id == c.id}"></option>
                        </select>
                        <small class="form-label text-danger" th:errors="*{caja}"></small>
                    </div>

                    <!-- Descripción -->
                    <div class="form mb-3">
                        <label for="descripcion" class="form-label">Descripción</label>
                        <input type="text" id="descripcion" class="form-control" th:field="*{descripcion}"
                            placeholder="Descripción de la compra" />
                        <small class="form-label text-danger" th:errors="*{descripcion}"></small>
                    </div>

                    <div class="mb-4">
                        <h5 class="mb-3">Detalles de la Compra</h5>
                        <div class="table-responsive">
                            <table class="table table-striped table-hover table-bordered" id="tablaDetalles">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Ingrediente</th>
                                        <th>Cantidad</th>
                                        <th>Precio Unitario</th>
                                        <th>Subtotal</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="detalle, stat : *{detalles}">
                                        <td>
                                            <select class="form-select"
                                                th:field="*{detalles[__${stat.index}__].ingrediente.id}">
                                                <option value="">Seleccionar ingrediente</option>
                                                <option th:each="ing : ${ingredientes}" th:value="${ing.id}"
                                                    th:text="${ing.nombreIngrediente} + ' (' + ${ing.unidadMedida} + ')'">
                                                </option>
                                            </select>
                                        </td>
                                        <td>
                                            <input type="number" class="form-control cantidad" min="1" step="1"
                                                th:field="*{detalles[__${stat.index}__].cantidad}" />
                                        </td>
                                        <td>
                                            <input type="number" class="form-control precio" min="0.01" step="0.01"
                                                th:field="*{detalles[__${stat.index}__].precioUnitario}" />
                                        </td>
                                        <td
                                            th:text="${#numbers.formatDecimal(detalle.cantidad * detalle.precioUnitario, 1, 2)}">
                                            0.00</td>
                                        <td>
                                            <button type="button" class="btn btn-danger btn-sm btn-eliminar">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                                <tfoot>
                                    <tr>
                                        <td colspan="3" class="text-end fw-bold">Total:</td>
                                        <td id="totalTabla"
                                            th:text="${#numbers.formatDecimal(compra.getTotal(), 1, 2)}">0.00</td>
                                        <td></td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>

                        <button type="button" id="agregarDetalleBtn" class="btn btn-success">
                            <i class="bi bi-plus-circle"></i> Agregar Detalle
                        </button>
                        <button type="button" class="btn btn-outline-primary ms-2" data-bs-toggle="modal"
                            data-bs-target="#modalNuevoIngrediente">
                            <i class="bi bi-plus-circle"></i> Nuevo Ingrediente
                        </button>


                        <!-- Botones finales -->
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <button type="submit" class="btn btn-outline-primary me-md-2">
                                <i class="bi bi-save"></i> Guardar Compras
                            </button>
                            <a th:href="@{/compras/listado}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle"></i> Cancelar
                            </a>
                        </div>
                    </div>
            </form>
            <!-- Modal para nuevo ingrediente -->
            <div class="modal fade" id="modalNuevoIngrediente" tabindex="-1"
                aria-labelledby="modalNuevoIngredienteLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <form id="formNuevoIngrediente">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="modalNuevoIngredienteLabel">Agregar nuevo
                                    ingrediente</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"
                                    aria-label="Cerrar"></button>
                            </div>
                            <div class="modal-body">
                                <div class="mb-3">
                                    <label class="form-label">Nombre</label>
                                    <input type="text" class="form-control" id="nuevoIngredienteNombre" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Unidad de Medida</label>
                                    <input type="text" class="form-control" id="nuevoIngredienteUnidad" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Precio Total</label>
                                    <input type="number" class="form-control" id="nuevoIngredientePrecio" min="0.01"
                                        step="0.01" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Cantidad Total del Ingrediente</label>
                                    <input type="number" class="form-control" id="nuevoIngredienteCantidad" min="1"
                                        required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Fecha Ingreso</label>
                                    <input type="date" class="form-control" id="nuevoIngredienteFechaIngreso" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Fecha Vencimiento</label>
                                    <input type="date" class="form-control" id="nuevoIngredienteFechaVencimiento"
                                        required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Proveedor</label>
                                    <select class="form-select" id="nuevoIngredienteProveedor" required>
                                        <option value="">Seleccionar proveedor</option>
                                        <option th:each="prov : ${proveedores}" th:value="${prov.id}"
                                            th:text="${prov.nombre}"></option>
                                    </select>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary"
                                    data-bs-dismiss="modal">Cancelar</button>
                                <button type="submit" class="btn btn-primary">Agregar</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    </div>

    <script th:fragment="js">
        $(document).ready(function () {
            // Capturar opciones de ingredientes del template oculto
            const ingredientesOptions = $('#ingredientes-options').html();

            // Función para agregar nueva fila
            function agregarFila(index) {
                const newRow = `
                <tr>
                    <td>
                        <select class="form-select" name="detalles[${index}].ingrediente.id" required>
                            <option value="">Seleccionar ingrediente</option>
                            ${ingredientesOptions}
                        </select>
                    </td>
                    <td>
                        <input type="number" class="form-control cantidad" name="detalles[${index}].cantidad" min="1" required>
                    </td>
                    <td>
                        <input type="number" class="form-control precio" name="detalles[${index}].precioUnitario" min="0.01" step="0.01" required>
                    </td>
                    <td class="subtotal">0.00</td>
                    <td>
                        <button type="button" class="btn btn-danger btn-sm btn-eliminar">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>`;
                return newRow;
            }

            // Evento para agregar detalle
            $('#agregarDetalleBtn').click(function () {
                const index = $('#tablaDetalles tbody tr').length;
                const newRow = agregarFila(index);
                $('#tablaDetalles tbody').append(newRow);

                // Inicializar eventos en la nueva fila
                const $newRow = $('#tablaDetalles tbody tr').last();
                $newRow.find('.cantidad, .precio').on('input', calcularSubtotal);
                $newRow.find('.btn-eliminar').click(eliminarDetalle);
            });

            // Cálculo de subtotal
            function calcularSubtotal() {
                const row = $(this).closest("tr");
                const cantidad = parseFloat(row.find('.cantidad').val()) || 0;
                const precio = parseFloat(row.find('.precio').val()) || 0;
                const subtotal = cantidad * precio;
                row.find('.subtotal').text(subtotal.toFixed(2));
                calcularTotal();
            }

            // Eliminar fila
            function eliminarDetalle() {
                Swal.fire({
                    title: '¿Eliminar este item?',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonText: 'Sí, eliminar',
                    cancelButtonText: 'No'
                }).then((result) => {
                    if (result.isConfirmed) {
                        $(this).closest("tr").remove();
                        calcularTotal();
                        reindexarFilas();
                    }
                });
            }

            // Cálculo de total
            function calcularTotal() {
                let total = 0;
                $('.subtotal').each(function () {
                    total += parseFloat($(this).text()) || 0;
                });
                $("#totalTabla").text(total.toFixed(2));
            }

            // Reindexar filas
            function reindexarFilas() {
                $('#tablaDetalles tbody tr').each(function (newIndex) {
                    $(this).find('[name]').each(function () {
                        const newName = $(this).attr('name')
                            .replace(/detalles\[\d+\]/g, `detalles[${newIndex}]`);
                        $(this).attr('name', newName);
                    });
                });
            }

            // Eventos iniciales
            $(document).on('input', '.cantidad, .precio', calcularSubtotal);
            $(document).on('click', '.btn-eliminar', eliminarDetalle);

            // Validación: No permitir guardar compra sin detalles
            $('#formCompra').on('submit', function (e) {
                if ($('#tablaDetalles tbody tr').length === 0) {
                    e.preventDefault();
                    Swal.fire("Debes agregar al menos un detalle", "", "warning");
                }
            });
        });

        // Modal y AJAX para nuevo ingrediente
        $('#formNuevoIngrediente').on('submit', function (e) {
            e.preventDefault();
            var nombre = $('#nuevoIngredienteNombre').val();
            var unidad = $('#nuevoIngredienteUnidad').val();
            var precio = $('#nuevoIngredientePrecio').val();
            var cantidad = $('#nuevoIngredienteCantidad').val();
            var fechaIngreso = $('#nuevoIngredienteFechaIngreso').val();
            var fechaVencimiento = $('#nuevoIngredienteFechaVencimiento').val();
            var proveedorId = $('#nuevoIngredienteProveedor').val();

            if (nombre.trim() === "" || unidad.trim() === "") {
                Swal.fire("Completa todos los campos", "", "warning");
                return;
            }

            // Obtén el token CSRF de un meta tag o input hidden generado por Thymeleaf
            var csrfToken = $("meta[name='_csrf']").attr("content");
            var csrfHeader = $("meta[name='_csrf_header']").attr("content");

            $.ajax({
                url: '/inventario/ajax/crear', // Debe coincidir con el controller
                method: 'POST',
                data: {
                    nombre: nombre,
                    unidad: unidad,
                    precio: precio,
                    cantidad: cantidad,
                    fechaIngreso: fechaIngreso,
                    fechaVencimiento: fechaVencimiento,
                    proveedorId: proveedorId
                },
                beforeSend: function (xhr) {
                    if (csrfToken && csrfHeader) {
                        xhr.setRequestHeader(csrfHeader, csrfToken);
                    }
                },
                success: function (data) {
                    $('#modalNuevoIngrediente').modal('hide');
                    $('#nuevoIngredienteNombre').val('');
                    $('#nuevoIngredienteUnidad').val('');
                    $('#nuevoIngredientePrecio').val('');
                    $('#nuevoIngredienteCantidad').val('');
                    $('#nuevoIngredienteFechaIngreso').val('');
                    $('#nuevoIngredienteFechaVencimiento').val('');
                    $('#nuevoIngredienteProveedor').val('');
                    // Agregar el nuevo ingrediente a las opciones de los selects
                    let option = $('<option>').val(data.id).text(data.nombreIngrediente + ' (' + data.unidadMedida + ')');
                    $('select[name$=".ingrediente.id"]').each(function () {
                        $(this).append(option.clone());
                    });
                    $('#ingredientes-options').append(option.clone());
                    Swal.fire("Ingrediente agregado", "Ya puedes usarlo en el detalle", "success");
                },
                error: function () {
                    Swal.fire("No se pudo agregar", "Intenta nuevamente", "error");
                }
            });
        });
    </script>
    </div>
</body>

</html>

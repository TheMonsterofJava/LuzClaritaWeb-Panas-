<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra a proveedores</title>
    
    <th:block layout:fragment="styles">
    </th:block>
</head>

<body>
    <!-- Contenido principal -->
    <div layout:fragment="content" class="main-content">
        <!-- Template oculto para opciones de ingredientes -->
        <div id="ingredientes-options" class="d-none">
            <option th:each="ing : ${ingredientes}" 
                    th:value="${ing.id}"
                    th:text="${ing.nombreIngrediente} + ' (' + ${ing.unidadMedida} + ')'">
            </option>
        </div>

        <div class="card card-text">
            <div class="card-header bg-primary text-white">
                <h4 class="text-title">Nueva compra a Proveedores</h4>
            </div>

            <form id="formCompra" th:action="@{/compras/guardar}" method="post" th:object="${compra}">
                <input type="hidden" th:field="*{id}" />

                <div class="card-body">
                    <!-- Sección de proveedor -->
                    <div class="mb-3">
                        <label for="proveedor" class="form-label">Proveedor</label>
                        <select id="proveedor" class="form-select" th:field="*{proveedor.id}" required>
                            <option value="">Seleccione un proveedor</option>
                            <option th:each="prov : ${proveedores}" 
                                    th:value="${prov.id}" 
                                    th:text="${prov.nombre}"
                                    th:selected="${compra.proveedor != null and compra.proveedor.id == prov.id}">
                            </option>
                        </select>
                        <small class="text-danger" th:errors="*{proveedor}"></small>
                    </div>

                    <!-- Sección de caja -->
                    <div class="mb-3">
                        <label for="caja" class="form-label">Caja</label>
                        <select id="caja" class="form-select" th:field="*{caja.id}" required>
                            <option value="">Seleccione una caja abierta</option>
                            <option th:each="c : ${cajasAbiertas}" 
                                    th:value="${c.id}" 
                                    th:text="'Caja #' + ${c.id}"
                                    th:selected="${compra.caja != null and compra.caja.id == c.id}">
                            </option>
                        </select>
                        <small class="text-danger" th:errors="*{caja}"></small>
                    </div>

                    <!-- Descripción -->
                    <div class="mb-4">
                        <label for="descripcion" class="form-label">Descripción</label>
                        <input type="text" id="descripcion" class="form-control" 
                               th:field="*{descripcion}" placeholder="Descripción de la compra" />
                        <small class="text-danger" th:errors="*{descripcion}"></small>
                    </div>

                    <!-- Detalles de la compra -->
                    <div class="mb-4">
                        <h5 class="mb-3 text-secondary">Detalles de la Compra</h5>
                        
                        <div class="table-responsive">
                            <table class="table table-striped table-hover table-bordered" id="tablaDetalles">
                                <thead class="table-dark">
                                    <tr>
                                        <th width="35%">Ingrediente</th>
                                        <th width="15%">Cantidad</th>
                                        <th width="20%">Precio Unitario</th>
                                        <th width="20%">Subtotal</th>
                                        <th width="10%">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="detalle, stat : *{detalles}">
                                        <td>
                                            <select class="form-select select2-ingrediente" 
                                                    th:field="*{detalles[__${stat.index}__].ingrediente.id}" required>
                                                <option value="">Seleccionar ingrediente</option>
                                                <option th:each="ing : ${ingredientes}" 
                                                        th:value="${ing.id}"
                                                        th:text="${ing.nombreIngrediente} + ' (' + ${ing.unidadMedida} + ')'">
                                                </option>
                                            </select>
                                        </td>
                                        <td>
                                            <input type="number" class="form-control cantidad" min="1" step="1"
                                                   th:field="*{detalles[__${stat.index}__].cantidad}" required>
                                        </td>
                                        <td>
                                            <input type="number" class="form-control precio" min="0.01" step="0.01"
                                                   th:field="*{detalles[__${stat.index}__].precioUnitario}" required>
                                        </td>
                                        <td th:text="${#numbers.formatDecimal(detalle.cantidad * detalle.precioUnitario, 1, 2)}">
                                            0.00
                                        </td>
                                        <td class="text-center">
                                            <button type="button" class="btn btn-danger btn-sm btn-eliminar">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                                <tfoot class="table-group-divider">
                                    <tr>
                                        <td colspan="3" class="text-end fw-bold">Total:</td>
                                        <td id="totalTabla" class="fw-bold"
                                            th:text="${#numbers.formatDecimal(compra.getTotal(), 1, 2)}">
                                            0.00
                                        </td>
                                        <td></td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>

                        <div class="d-flex justify-content-between mt-3">
                            <button type="button" id="agregarDetalleBtn" class="btn btn-success">
                                <i class="bi bi-plus-circle"></i> Agregar Detalle
                            </button>
                            
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <button type="submit" class="btn btn-primary me-md-2">
                                    <i class="bi bi-save"></i> Guardar Compras
                                </button>
                                <a th:href="@{/compras/listado}" class="btn btn-outline-secondary">
                                    <i class="bi bi-x-circle"></i> Cancelar
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <!-- Primero jQuery -->
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        
        <!-- Luego Select2 -->
        <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
        <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
        
        <!-- Opcional: Select2 en español -->
        <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/i18n/es.js"></script>

        <!-- SweetAlert2 -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        
        <!-- Bootstrap Icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
            
        <!-- Finalmente tu script -->
        <script th:src="@{/js/compras.js}"></script>
    </th:block>
</body>
</html>

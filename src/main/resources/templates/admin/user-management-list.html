<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin}">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lista de Usuarios</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"/>
    
    <!-- SweetAlert CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    
    <!-- DataTables CSS -->
    <link href="https://cdn.jsdelivr.net/npm/simple-datatables@latest/dist/style.css" rel="stylesheet" />
    
    <th:block layout:fragment="styles">
        <style>
            html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh; 
            background-color: #f8f9fa; /* Color rosado/beige de fondo */
            }
            .main-content {
                width: 100%;
                min-height: 100vh; /* Asegura que siempre ocupe toda la pantalla */
            }
            .card {
                box-shadow: 0 0.15rem 1.75rem 0 rgba(33, 40, 50, 0.15);
            }
            .avatar-img {
                width: 40px;
                height: 40px;
                border-radius: 50%;
            }
        </style>
    </th:block>
</head>

<body>
    <!-- Contenido principal -->
    <div layout:fragment="content" class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="mb-0">
                <i class="fas fa-users me-2"></i>
                Lista de Usuarios
            </h1>
            <a class="btn btn-primary" href="/admin/user-management-add-user">
                <i class="fas fa-user-plus me-1"></i>
                Añadir Nuevo Usuario
            </a>
        </div>
        
        <div class="card">
            <div class="card-body">
                <table id="datatablesSimple" class="table table-striped">
                    <thead>
                        <tr>
                            <th>Usuario</th>
                            <th>Correo</th>
                            <th>Rol</th>
                            <th>Fecha de Registro</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${usuariosPage.empty}">
                            <td colspan="5">No hay usuarios registrados.</td>
                        </tr>
                        <tr th:each="usuario : ${usuariosPage.content}" th:unless="${usuariosPage.empty}">
                            <td>
                                <div class="d-flex align-items-center">
                                    <div class="avatar me-2">
                                        <img class="avatar-img img-fluid" 
                                             th:src="@{/assets/img/illustrations/profiles/profile-1.png}" />
                                    </div>
                                    <span th:text="${usuario.nomb_usu}"></span>
                                </div>
                            </td>
                            <td th:text="${usuario.email}"></td>
                            <td th:text="${usuario.permiso.nombre}"></td>
                            <td th:text="${#dates.format(usuario.fecha_creacion, 'dd/MM/yyyy')}"></td>
                            <td>
                                <a class="btn btn-sm btn-outline-primary me-2" 
                                   th:href="@{/admin/user-management-edit-user/{id}(id=${usuario.id})}">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <a class="btn btn-sm btn-outline-danger" 
                                   th:href="@{/admin/usuarios/eliminar/{id}(id=${usuario.id})}"
                                   onclick="confirmarEliminacion(event, this.href)">
                                    <i class="fas fa-trash-alt"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
                
                <!-- Paginación -->
                <nav aria-label="Page navigation" th:if="${usuariosPage.totalPages > 1}">
                    <ul class="pagination justify-content-center mt-4">
                        <!-- Botón Anterior -->
                        <li class="page-item" th:classappend="${usuariosPage.first} ? 'disabled' : ''">
                            <a class="page-link" 
                               th:href="@{/admin/user-management-list(page=${usuariosPage.number - 1}, size=${usuariosPage.size})}">
                                Anterior
                            </a>
                        </li>

                        <!-- Números de Página -->
                        <li class="page-item" 
                            th:each="i : ${#numbers.sequence(0, usuariosPage.totalPages - 1)}"
                            th:classappend="${i == usuariosPage.number} ? 'active' : ''">
                            <a class="page-link" 
                               th:href="@{/admin/user-management-list(page=${i}, size=${usuariosPage.size})}"
                               th:text="${i + 1}"></a>
                        </li>

                        <!-- Botón Siguiente -->
                        <li class="page-item" th:classappend="${usuariosPage.last} ? 'disabled' : ''">
                            <a class="page-link" 
                               th:href="@{/admin/user-management-list(page=${usuariosPage.number + 1}, size=${usuariosPage.size})}">
                                Siguiente
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- Scripts específicos -->
    <th:block layout:fragment="scripts">
        <!-- JavaScript -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/simple-datatables@latest"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        
        <!-- Script para la tabla -->
        <script>
            window.addEventListener('DOMContentLoaded', event => {
                const datatablesSimple = document.getElementById('datatablesSimple');
                if (datatablesSimple) {
                    new simpleDatatables.DataTable(datatablesSimple, {
                        labels: {
                            placeholder: "Buscar...",
                            perPage: "registros por página",
                            noRows: "No se encontraron registros",
                            info: "Mostrando {start} a {end} de {rows} registros",
                        }
                    });
                }
            });
        </script>

        <!-- Función para confirmar la eliminación de un usuario con Sweet Alert -->
        <script>
            function confirmarEliminacion(event, url) {
                event.preventDefault();
                
                Swal.fire({
                    title: '¿Estás seguro?',
                    text: "¡No podrás revertir esto!",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#d33',
                    cancelButtonColor: '#3085d6',
                    confirmButtonText: 'Sí, eliminar',
                    cancelButtonText: 'Cancelar'
                }).then((result) => {
                    if (result.isConfirmed) {
                        // Obtener el token CSRF
                        const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
                        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');
                        
                        fetch(url, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                [csrfHeader]: csrfToken
                            }
                        })
                        .then(response => {
                            if (!response.ok) {
                                throw new Error('Error en la solicitud');
                            }
                            return response.json();
                        })
                        .then(data => {
                            if (data.success) {
                                Swal.fire(
                                    '¡Eliminado!',
                                    data.message,
                                    'success'
                                ).then(() => {
                                    window.location.reload();
                                });
                            } else {
                                Swal.fire(
                                    'Error',
                                    data.message,
                                    'error'
                                );
                            }
                        })
                        .catch(error => {
                            console.error('Error:', error);
                            Swal.fire(
                                'Error',
                                'Ocurrió un error al eliminar el usuario.',
                                'error'
                            );
                        });
                    }
                });
            }
        </script>

        <!-- Script para mostrar alertas de SweetAlert -->
        <script th:inline="javascript">
            /*<![CDATA[*/
            document.addEventListener('DOMContentLoaded', function () {
                var successMessage = /*[[${success}]]*/ null;
                var errorMessage = /*[[${error}]]*/ null;

                if (successMessage) {
                    Swal.fire({
                        icon: 'success',
                        title: '¡Éxito!',
                        text: successMessage,
                    });
                }

                if (errorMessage) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: errorMessage,
                    });
                }
            });
            /*]]>*/
        </script>
    </th:block>
</body>
</html>

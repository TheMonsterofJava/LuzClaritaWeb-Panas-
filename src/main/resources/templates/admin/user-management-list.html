<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Panel de Control para el Administrador</title>

        <!-- CSS -->
        <link th:href="@{/css/styles.css}" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/simple-datatables@latest/dist/style.css" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/litepicker/dist/css/litepicker.css" rel="stylesheet" />

        <!-- Favicon -->
        <link rel="icon" type="image/x-icon" th:href="@{/img/favicon.png}" />

        <!-- Font Awesome -->
        <script data-search-pseudo-elements="" defer=""
            src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/js/all.min.js"
            crossorigin="anonymous"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.28.0/feather.min.js"
            crossorigin="anonymous"></script>

        <!-- SweetAlert CSS -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

        <!--Toquen de seguridad -->
        <meta name="_csrf" th:content="${_csrf.token}" />
        <meta name="_csrf_header" th:content="${_csrf.headerName}" />

        <head>
            <meta name="_csrf" th:content="${_csrf.token}"/>
            <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
        </head>
    </head>

<body class="nav-fixed">
    
        <div id="layoutSidenav_content">
            <main>
                <header class="page-header page-header-compact page-header-light border-bottom bg-white mb-4">
                    <div class="container-fluid px-4">
                        <div class="page-header-content">
                            <div class="row align-items-center justify-content-between pt-3">
                                <div class="col-auto mb-3">
                                    <h1 class="page-header-title">
                                        <div class="page-header-icon"><i data-feather="user"></i></div>
                                        Listado de usuarios
                                    </h1>
                                </div>
                                <div class="col-12 col-xl-auto mb-3">
                                    <a class="btn btn-sm btn-light text-primary" href="/admin/dashboard-1">
                                        Dashboard
                                    </a>
                                    <a class="btn btn-sm btn-light text-primary"
                                        href="/admin/user-management-groups-list">
                                        <i class="me-1" data-feather="users"></i>
                                        Gestionar grupos
                                    </a>
                                    <a class="btn btn-sm btn-light text-primary" href="/admin/user-management-add-user">
                                        <i class="me-1" data-feather="user-plus"></i>
                                        Nuevo usuario
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </header>
                <!-- Main page content -->
                <div class="container-fluid px-4">
                    <div class="card">
                        <div class="card-body">
                            <table id="datatablesSimple">
                                <thead>
                                    <tr>
                                        <th>Usuario</th>
                                        <th>Email</th>
                                        <th>Rol</th>
                                        <th>Fecha</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tfoot>
                                    <tr>
                                        <th>Usuario</th>
                                        <th>Email</th>
                                        <th>Rol</th>
                                        <th>Fecha</th>
                                        <th>Acciones</th>
                                    </tr>
                                </tfoot>
                                <tbody>
                                    <tr th:if="${usuarios.empty}">
                                        <td colspan="5">No hay usuarios registrados.</td>
                                    </tr>
                                    <tr th:each="usuario : ${usuarios}" th:unless="${usuarios.empty}">
                                        <td>
                                            <div class="d-flex align-items-center">
                                                <div class="avatar me-2">
                                                    <img class="avatar-img img-fluid"
                                                        th:src="@{/assets/img/illustrations/profiles/profile-1.png}" />
                                                </div>
                                                <span th:text="${usuario.nomb_usu}"></span>
                                            </div>
                                        </td>
                                        <td th:text="${usuario.email}"></td>
                                        <td th:text="${usuario.permiso.nombre}"></td>
                                        <td th:text="${#dates.format(usuario.fecha_creacion, 'dd MMM yyyy')}"></td>
                                        <td>
                                            <a class="btn btn-datatable btn-icon btn-transparent-dark me-2"
                                                th:href="@{/admin/user-management-edit-user/{id}(id=${usuario.id})}">
                                                <i data-feather="edit"></i>
                                            </a>
                                            <a class="btn btn-datatable btn-icon btn-transparent-dark"
                                                th:href="@{/admin/usuarios/eliminar/{id}(id=${usuario.id})}"
                                                onclick="confirmarEliminacion(event, this.href)">
                                                <i data-feather="trash-2"></i>
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>


    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <script src="/js/scripts.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.min.js" crossorigin="anonymous"></script>
    <script src="/assets/demo/chart-area-demo.js"></script>
    <script src="/assets/demo/chart-bar-demo.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simple-datatables@latest" crossorigin="anonymous"></script>
    <script src="/js/datatables/datatables-simple-demo.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/litepicker/dist/bundle.js" crossorigin="anonymous"></script>
    <script src="/js/litepicker.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simple-datatables@latest" crossorigin="anonymous"></script>
    <script>
        window.addEventListener('DOMContentLoaded', event => {
            const datatablesSimple = document.getElementById('datatablesSimple');
            if (datatablesSimple) {
                new simpleDatatables.DataTable(datatablesSimple);
            }
        });
    </script>

    <!-- Función para confirmar la eliminación de un usuario con Sweet Alert y toquen de Seguridad CSRF-->
    <script>
        function confirmarEliminacion(event, url) {
            event.preventDefault();

            // Obtener el token CSRF
            const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

            if (confirm('¿Estás seguro de que deseas eliminar este usuario?')) {
                fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        [csrfHeader]: csrfToken // Incluir el token CSRF en los headers
                    }
                })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Error en la solicitud');
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (data.success) {
                            alert(data.message);
                            window.location.reload(); // Recargar la página después de eliminar
                        } else {
                            alert(data.message);
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('Ocurrió un error al eliminar el usuario.');
                    });
            }
        }
    </script>

    <!-- SweetAlert JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>

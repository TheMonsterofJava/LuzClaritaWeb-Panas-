<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin}">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Editar Usuario</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"/>
    
    <!-- Boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <th:block layout:fragment="styles">
        <style>
            html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh; 
            background-color: #f8f9fa; /* Color rosado/beige de fondo */
            }

            .main-content {
                width: 100%;
                min-height: 100vh; /* Asegura que siempre ocupe toda la pantalla */
            }
        </style>
    </th:block>
</head>

<body>
    <!-- Contenido principal -->
    <div layout:fragment="content" class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="mb-0">
                <i class="fas fa-edit"></i>
                Editar Usuario
            </h1>
            <a class="btn btn-outline-primary" href="/admin/user-management-list">
                <i class="fas fa-arrow-left me-1"></i>
                Volver a la Lista
            </a>
        </div>
        <div class="row">
            <div class="col-xl-4">
                <!-- Profile picture card-->
                <div class="card mb-4 mb-xl-0">
                    <div class="card-header bg-primary text-white">Foto de Perfil</div>
                    <div class="card-body text-center">
                        <!-- Profile picture image-->
                        <img class="img-account-profile rounded-circle mb-2" id="img-preview"
                            th:src="${usuario.foto != null ? '/uploads/' + usuario.foto : '/assets/img/illustrations/profiles/profile-1.png'}"
                            alt="Foto de perfil" />
                        <!-- Profile picture help block-->
                        <div class="small font-italic text-muted mb-4">JPG o PNG no mayor a 5 MB</div>
                        <!-- Profile picture upload button-->
                        <input type="file" id="foto" name="foto" class="form-control" onchange="previewImage(event)">
                    </div>
                </div>
            </div>
            <div class="col-xl-8">
                <div class="card mb-4">
                    <div class="card-header bg-primary text-white">Detalles de la Cuenta</div>
                    <div class="card-body">
                        <form id="edit-user-form"
                            th:action="@{/admin/user-management-edit-user/{id}(id=${usuario.id})}" method="post"
                            th:object="${usuario}" onsubmit="return validarFormulario()" enctype="multipart/form-data">
                            <!-- Nombre de Usuario -->
                            <div class="row gx-3 mb-3">
                                <div class="col-md-6">
                                    <label class="small mb-1" for="nomb_usu">Nombre de Usuario</label>
                                    <input class="form-control" id="nomb_usu" th:field="*{nomb_usu}" required />
                                </div>
                                <!-- Correo Electrónico -->
                                <div class="col-md-6">
                                    <label class="small mb-1" for="email">Correo Electrónico</label>
                                    <input class="form-control" id="email" th:field="*{email}" type="email" required />
                                </div>
                            </div>
                            <!-- Contraseña Actual -->
                            <div class="mb-3">
                                <label class="small mb-1" for="claveActual">Contraseña Actual</label>
                                <div class="input-group">
                                    <input class="form-control" id="claveActual" th:field="*{clave}" type="text"
                                        readonly />
                                    <button type="button" class="btn btn-outline-secondary"
                                        onclick="togglePassword('claveActual')">
                                        <i class='bx bx-hide'></i>
                                    </button>
                                </div>
                            </div>
                            <!-- Nueva Contraseña -->
                            <div class="mb-3">
                                <label class="small mb-1" for="nuevaClave">Nueva Contraseña</label>
                                <div class="input-group">
                                    <input class="form-control" id="nuevaClave" name="nuevaClave" type="password"
                                        minlength="5" maxlength="75" />
                                    <button type="button" class="btn btn-outline-secondary"
                                        onclick="togglePassword('nuevaClave')">
                                        <i class='bx bx-hide'></i>
                                    </button>
                                </div>
                            </div>
                            <!-- Confirmar Nueva Contraseña -->
                            <div class="mb-3">
                                <label class="small mb-1" for="confirmarNuevaClave">Confirmar Nueva
                                    Contraseña</label>
                                <div class="input-group">
                                    <input class="form-control" id="confirmarNuevaClave" name="confirmarNuevaClave"
                                        type="password" minlength="5" maxlength="75" />
                                    <button type="button" class="btn btn-outline-secondary"
                                        onclick="togglePassword('confirmarNuevaClave')">
                                        <i class='bx bx-hide'></i>
                                    </button>
                                </div>
                            </div>
                            <!-- Rol -->
                            <div class="mb-3">
                                <label class="small mb-1" for="permiso">Rol</label>
                                <select class="form-select" id="permiso" th:field="*{permiso.id}" required>
                                    <option th:each="permiso : ${permisos}" th:value="${permiso.id}"
                                        th:text="${permiso.nombre}"></option>
                                </select>
                            </div>
                            <!-- Mensaje de error -->
                            <div id="error-message" class="text-danger mb-3" style="display: none;">
                                Las contraseñas no coinciden.
                            </div>
                            <!-- Submit button-->
                            <button class="btn btn-primary" type="submit">Guardar Cambios</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts específicos -->
    <th:block layout:fragment="scripts">  
        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <!-- SweetAlert JS -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        
        <script>
            // Script para previsualizar la imagen
            function previewImage(event) {
                const reader = new FileReader();
                reader.onload = function() {
                    const output = document.getElementById('img-preview');
                    output.src = reader.result;
                };
                reader.readAsDataURL(event.target.files[0]);
            }

            // Script para mostrar/ocultar contraseña
            function togglePassword(inputId) {
                const input = document.getElementById(inputId);
                const icon = input.nextElementSibling.querySelector('i');
                if (input.type === "password" || input.type === "text") {
                    input.type = input.type === "password" ? "text" : "password";
                    icon.classList.toggle('bx-hide');
                    icon.classList.toggle('bx-show');
                }
            }

            // Script para validar el formulario
            function validarFormulario() {
                const nuevaClave = document.getElementById('nuevaClave').value;
                const confirmarNuevaClave = document.getElementById('confirmarNuevaClave').value;
                const errorMessage = document.getElementById('error-message');

                if (nuevaClave !== confirmarNuevaClave) {
                    errorMessage.style.display = 'block';
                    return false;
                } else {
                    errorMessage.style.display = 'none';
                    return true;
                }
            }

            // Script para confirmación con SweetAlert
            document.getElementById('edit-user-form').addEventListener('submit', function(event) {
                event.preventDefault();

                if (!validarFormulario()) {
                    return;
                }

                Swal.fire({
                    title: '¿Estás seguro de guardar los cambios?',
                    text: "Esta acción no se puede deshacer.",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#3085d6',
                    cancelButtonColor: '#d33',
                    confirmButtonText: 'Sí, guardar cambios',
                    cancelButtonText: 'Cancelar'
                }).then((result) => {
                    if (result.isConfirmed) {
                        event.target.submit();
                    }
                });
            });
        </script>
    </th:block>
</body>

</html>

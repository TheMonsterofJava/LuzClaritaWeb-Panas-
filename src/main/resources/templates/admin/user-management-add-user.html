<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin}">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Añadir Usuario</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"/>
    
    <!-- Boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <th:block layout:fragment="styles">
        <style>
            html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh; 
            background-color: #f8f9fa; /* Color rosado/beige de fondo */
            }

            .main-content {
                width: 100%;
                min-height: 100vh; /* Asegura que siempre ocupe toda la pantalla */
            }
        </style>
    </th:block>
</head>

<body>
    <!-- Contenido principal -->
    <div layout:fragment="content" class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="mb-0">
                <i class="fas fa-user-plus me-2"></i>
                Añadir Usuario
            </h1>
            <a class="btn btn-outline-primary" href="/admin/user-management-list">
                <i class="fas fa-arrow-left me-1"></i>
                Volver a la Lista
            </a>
        </div>
        
        <div class="row">
            <div class="col-xl-4">
                <!-- Tarjeta de imagen de perfil -->
                <div class="card mb-4 mb-xl-0">
                    <div class="card-header bg-primary text-white">Imagen de Perfil</div>
                    <div class="card-body text-center">
                        <!-- Vista previa de la imagen -->
                        <img class="img-account-profile rounded-circle mb-2" id="img-preview" 
                             src="/assets/img/demo/usseradd.png" alt="Previsualización de imagen" />
                        <div class="small text-muted mb-4">La imagen JPG o PNG debe ser menor a 10MB</div>
                        <!-- Botón para subir imagen -->
                        <input type="file" id="foto" name="foto" class="form-control" onchange="previewImage(event)">
                    </div>
                </div>
            </div>
            
            <div class="col-xl-8">
                <!-- Tarjeta de detalles de la cuenta -->
                <div class="card mb-4">
                    <div class="card-header bg-primary text-white">Detalles de la Cuenta</div>
                    <div class="card-body">
                        <form th:action="@{/admin/user-management-add-user}" method="post" th:object="${usuario}" 
                              onsubmit="return validarFormulario()" enctype="multipart/form-data">
                            <!-- Fila de nombre y email -->
                            <div class="row gx-3 mb-3">
                                <!-- Nombre de Usuario -->
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="nomb_usu">Nombre de Usuario</label>
                                    <input class="form-control" id="nomb_usu" th:field="*{nomb_usu}" required />
                                </div>

                                <!-- Correo Electrónico -->
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="email">Correo Electrónico</label>
                                    <input class="form-control" id="email" th:field="*{email}" type="email" required />
                                </div>
                            </div>

                            <!-- Contraseña -->
                            <div class="mb-3">
                                <label class="form-label" for="clave">Contraseña</label>
                                <div class="input-group">
                                    <input class="form-control" id="clave" th:field="*{clave}" type="password" 
                                           required minlength="5" maxlength="75" />
                                    <button type="button" class="btn btn-outline-secondary" 
                                            onclick="togglePassword('clave')">
                                        <i class='bx bx-hide'></i>
                                    </button>
                                </div>
                            </div>
                            
                            <!-- Confirmar Contraseña -->
                            <div class="mb-3">
                                <label class="form-label" for="confirmarClave">Confirmar Contraseña</label>
                                <div class="input-group">
                                    <input class="form-control" id="confirmarClave" type="password" required 
                                           minlength="5" maxlength="75" />
                                    <button type="button" class="btn btn-outline-secondary" 
                                            onclick="togglePassword('confirmarClave')">
                                        <i class='bx bx-hide'></i>
                                    </button>
                                </div>
                            </div>
                            
                            <!-- Rol -->
                            <div class="mb-3">
                                <label class="form-label" for="permiso">Rol</label>
                                <select class="form-select" id="permiso" th:field="*{permiso.id}" required>
                                    <option th:each="permiso : ${permisos}" th:value="${permiso.id}" 
                                            th:text="${permiso.nombre}"></option>
                                </select>
                            </div>
                            
                            <!-- Mensaje de error -->
                            <div id="error-message" class="alert alert-danger mb-3" style="display: none;">
                                Las contraseñas no coinciden.
                            </div>
                            
                            <!-- Botón de enviar -->
                            <button class="btn btn-primary" type="submit">
                                <i class="fas fa-save me-1"></i>
                                Guardar Usuario
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts específicos -->
    <th:block layout:fragment="scripts">    
        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        
        <!-- Script para previsualizar la imagen -->
        <script>
            function previewImage(event) {
                const reader = new FileReader();
                reader.onload = function() {
                    const output = document.getElementById('img-preview');
                    output.src = reader.result;
                };
                reader.readAsDataURL(event.target.files[0]);
            }
        </script>
        
        <!-- Script para mostrar/ocultar contraseña y validar el formulario -->
        <script>
            function togglePassword(inputId) {
                const input = document.getElementById(inputId);
                const icon = input.nextElementSibling.querySelector('i');
                if (input.type === "password") {
                    input.type = "text";
                    icon.classList.replace('bx-hide', 'bx-show');
                } else {
                    input.type = "password";
                    icon.classList.replace('bx-show', 'bx-hide');
                }
            }

            function validarFormulario() {
                const clave = document.getElementById('clave').value;
                const confirmarClave = document.getElementById('confirmarClave').value;
                const errorMessage = document.getElementById('error-message');

                if (clave !== confirmarClave) {
                    errorMessage.style.display = 'block';
                    return false; // Evita que el formulario se envíe
                } else {
                    errorMessage.style.display = 'none';
                    return true; // Permite que el formulario se envíe
                }
            }
        </script>
    </th:block>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agregar Usuario</title>
    <link href="/css/styles.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div layout:fragment="contenido">
        <div class="container-xl px-4 mt-4">
            <div class="row justify-content-center">
                <div class="col-xl-4">
                    <!-- Profile picture card-->
                    <div class="card mb-4 mb-xl-0">
                        <div class="card-header">Foto de Perfil</div>
                        <div class="card-body text-center">
                            <img class="img-account-profile rounded-circle mb-2" src="/assets/img/demo/usseradd.png"
                                alt="Foto de perfil" />
                            <div class="small font-italic text-muted mb-4">JPG o PNG no mayor a 5 MB</div>
                            <button class="btn btn-primary" type="button">Subir nueva imagen</button>
                        </div>
                    </div>
                </div>
                <div class="col-xl-8">
                    <!-- Account details card-->
                    <div class="card mb-4">
                        <div class="card-header">Detalles de la Cuenta</div>
                        <div class="card-body">
                            <form th:action="@{/admin/user-management-add-user}" method="post"
                                th:object="${usuario}" onsubmit="return validarFormulario()">
                                <div class="row gx-3 mb-3">
                                    <div class="col-md-6">
                                        <label class="small mb-1" for="nomb_usu">Nombre de Usuario</label>
                                        <input class="form-control" id="nomb_usu" th:field="*{nomb_usu}" required />
                                    </div>
                                    <div class="col-md-6">
                                        <label class="small mb-1" for="email">Correo Electrónico</label>
                                        <input class="form-control" id="email" th:field="*{email}" type="email" required />
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="small mb-1" for="clave">Contraseña</label>
                                    <div class="input-group">
                                        <input class="form-control" id="clave" th:field="*{clave}"
                                            type="password" required minlength="5" maxlength="75" />
                                        <button type="button" class="btn btn-outline-secondary"
                                            onclick="togglePassword('clave')">
                                            <i class='bx bx-hide'></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="small mb-1" for="confirmarClave">Confirmar Contraseña</label>
                                    <div class="input-group">
                                        <input class="form-control" id="confirmarClave" type="password" required
                                            minlength="5" maxlength="75" />
                                        <button type="button" class="btn btn-outline-secondary"
                                            onclick="togglePassword('confirmarClave')">
                                            <i class='bx bx-hide'></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="small mb-1" for="permiso">Rol</label>
                                    <select class="form-select" id="permiso" th:field="*{permiso.id}" required>
                                        <option th:each="permiso : ${permisos}" th:value="${permiso.id}"
                                            th:text="${permiso.nombre}"></option>
                                    </select>
                                </div>
                                <div id="error-message" class="text-danger mb-3" style="display: none;">
                                    Las contraseñas no coinciden.
                                </div>
                                <button class="btn btn-primary" type="submit">Guardar Usuario</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Script para mostrar/ocultar contraseña y validar el formulario -->
        <script>
            function togglePassword(inputId) {
                const input = document.getElementById(inputId);
                const icon = input.nextElementSibling.querySelector('i');
                if (input.type === "password") {
                    input.type = "text";
                    icon.classList.replace('bx-hide', 'bx-show');
                } else {
                    input.type = "password";
                    icon.classList.replace('bx-show', 'bx-hide');
                }
            }

            function validarFormulario() {
                const clave = document.getElementById('clave').value;
                const confirmarClave = document.getElementById('confirmarClave').value;
                const errorMessage = document.getElementById('error-message');
                if (clave !== confirmarClave) {
                    errorMessage.style.display = 'block';
                    return false;
                } else {
                    errorMessage.style.display = 'none';
                    return true;
                }
            }
        </script>
    </div>
</body>
</html>
